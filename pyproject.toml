[project]
name = "agentproof"
version = "0.1.0"
description = "Induces multi-turn test scenarios from agent interaction traces and replays them with goal-driven simulated users to detect regressions in LLM-based agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jarod Tierra Medina", email = "jarodtierra@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.11.9",
    "typer>=0.27.2",
]

[project.scripts]
agentproof = "agentproof.cli:app"

[project.optional-dependencies]
claude-sdk = [
    "claude-agent-sdk>=0.2.157",
]
crewai = [
    "crewai==1.15.23",
]
langgraph = [
    "langchain-anthropic==1.7.5",
    "langchain-core<=1.6.6",
    "langgraph==1.2.12",
]
smolagents = [
    "litellm<=1.103.3",
    "smolagents[litellm]==1.26.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.2.157",
    "crewai==1.15.23",
    "langchain-anthropic==1.7.5",
    "langchain-core<=1.6.6",
    "langgraph==1.2.12",
    "litellm<=1.103.3",
    "matplotlib==3.10.*",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "smolagents[litellm]==1.26.0",
]
studio = [
    "gradio==6.29.1",
    "langgraph-cli[inmem]==0.4.32",
    "smolagents[gradio]==1.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API; run with: uv run --env-file .env pytest -m live"]
addopts = "-m 'not live'"

[tool.uv.build-backend]
module-name = ["agentproof", "casestudy", "experiments"]
