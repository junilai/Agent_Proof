name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    name: Pruebas y estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest
