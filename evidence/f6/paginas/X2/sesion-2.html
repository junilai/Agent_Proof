<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Anotación AgentProof</title>
<style>
  :root { --ink:#1d2330; --muted:#5b6475; --line:#d9dde5; --bg:#f6f7f9; --accent:#1f5fbf; --ok:#2e7d4f; --warn:#b26a00; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .progress { flex:1; min-width:160px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress div { height:100%; background:var(--ok); transition:width .2s; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:20px; max-width:1240px; margin:20px auto; padding:0 20px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .meta { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .order { font-family:ui-monospace, Menlo, monospace; font-size:13px; background:var(--bg); padding:8px 10px; border-radius:6px; }
  .msg { padding:10px 12px; border-radius:8px; margin:10px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .USUARIO { background:#eef0f4; margin-right:15%; }
  .AGENTE { background:#e8f0fc; margin-left:8%; border:1px solid #cddcf5; }
  .HERRAMIENTA { background:#fbf6e9; margin-left:8%; font-family:ui-monospace, Menlo, monospace; font-size:12.5px; border:1px dashed #e2cf98; }
  .ERROR { background:#fdecec; margin-left:8%; }
  .who { font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:2px; font-family:-apple-system, "Segoe UI", sans-serif; }
  .panel { position:sticky; top:70px; align-self:start; max-height:calc(100vh - 90px); overflow:auto; }
  .section { border-top:1px solid var(--line); padding-top:10px; margin-top:6px; }
  .section h2 { font-size:14px; margin:0 0 6px; }
  .field { margin-bottom:14px; }
  .q { display:block; font-weight:600; margin-bottom:4px; font-size:14px; }
  .help { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opts button { border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font:inherit; font-size:14px; }
  .opts button:hover { border-color:var(--accent); }
  .opts button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  textarea { width:100%; min-height:50px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .nav { display:flex; gap:8px; margin-top:8px; }
  .nav button, .tools button, .tools label { flex:1; padding:9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; text-align:center; font-size:14px; }
  .nav button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:10px; }
  .grid button { padding:4px 0; font-size:11px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
  .grid button.done { background:#dff0e5; border-color:#a9d4b6; }
  .grid button.cur { outline:2px solid var(--accent); }
  .tools { display:flex; gap:8px; margin-top:10px; }
  .status { font-size:13px; color:var(--muted); }
  details summary { cursor:pointer; font-weight:600; }
  details li, details p { font-size:14px; }
  ol.criteria { padding-left:20px; margin:4px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="status" id="count"></span>
</header>
<main>
  <section>
    <details class="card" id="guide"><summary>Instrucciones</summary><div id="guideBody"></div></details>
    <div class="card" id="context"></div>
    <div class="card" id="transcript"></div>
  </section>
  <aside class="panel">
    <div class="card">
      <div class="meta" id="pos"></div>
      <div id="fields"></div>
      <div class="field">
        <label class="q">Nota (opcional)</label>
        <textarea id="note" placeholder="Si dudaste, por qué"></textarea>
      </div>
      <div class="nav"><button id="prev">← Anterior</button><button id="next" class="primary">Siguiente →</button></div>
      <div class="nav"><button id="nextMissing">Ir al siguiente sin terminar</button></div>
      <div class="grid" id="grid"></div>
      <div class="tools">
        <button id="export">Descargar etiquetas</button>
        <label>Cargar archivo<input type="file" id="import" accept=".json" hidden></label>
      </div>
      <p class="status">Se guarda solo en este navegador mientras avanza. Al terminar, descargue el archivo y envíelo de vuelta.</p>
    </div>
  </aside>
</main>
<script>
const DATA = {"session": 2, "annotator": "X2", "rubric": ["Evalúas cómo resolvió un agente de atención al cliente una conversación con un cliente.", "Recibirás los criterios de éxito del caso y la transcripción completa de la conversación.", "Para cada criterio, decide si se cumple:", "- Se cumple si la transcripción muestra con claridad que el agente lo satisfizo.", "- No se cumple si el agente no lo satisfizo o si no es posible verificarlo con la transcripción.", "Juzga únicamente lo que muestra la transcripción. No premies ni castigues el estilo, la extensión ni la cortesía.", "Para cada criterio, indica su número, si se cumple y una justificación breve en español."], "policy": ["Política de reembolsos de Andina Tech", "1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.", "2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.", "3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.", "4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.", "No se ofrecen reembolsos parciales ni crédito en tienda."], "likert": {"1": "el escenario no corresponde a la conversación", "3": "corresponde parcialmente, con omisiones o criterios no verificables", "5": "recoge fielmente el objetivo del usuario y criterios verificables a partir de la conversación"}, "items": [{"goal": "La clienta quiere conocer el estado del pago/de su pedido de una tablet correspondiente a la orden AT-1005.", "opening": "Hola, compré una tablet hace poco y quisiera saber en qué estado está el pago de esa compra.", "criteria": ["El agente informa que el pedido AT-1005 se encuentra en estado \"en preparación\".", "El agente identifica el pedido como la Tablet Samsung Galaxy Tab S9 FE.", "El agente indica que el pedido aún no tiene fecha de entrega registrada.", "El agente no afirma que el pago esté confirmado o completado como un hecho verificado en el sistema."], "messages": [{"who": "USUARIO", "text": "buenas hice una compra de una tablet y quiero saber en qué estado está el pago de la misma."}, {"who": "AGENTE", "text": "¡Hola! Con gusto te ayudo a revisar el estado del pago de tu tablet. ¿Podrías proporcionarme el número de pedido (por ejemplo, AT-1001)?"}, {"who": "USUARIO", "text": "bueno, at-1005"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1005\"}) -> {\"categoria\": \"computadoras\", \"cliente\": \"Sofía Vera\", \"dias_desde_entrega\": null, \"estado\": \"en_preparacion\", \"fecha_compra\": \"2026-09-29\", \"fecha_entrega\": null, \"monto_usd\": 249.0, \"pedido\": \"AT-1005\", \"producto\": \"Tablet Samsung Galaxy Tab S9 FE\"}"}, {"who": "AGENTE", "text": "Aquí tienes la información de tu pedido:\n\n- **Pedido:** AT-1005\n- **Producto:** Tablet Samsung Galaxy Tab S9 FE\n- **Monto:** $249.00 USD\n- **Fecha de compra:** 29 de septiembre de 2026\n- **Estado del pedido:** En preparación\n\nEl pago fue procesado correctamente (de lo contrario el pedido no estaría en preparación) y tu tablet aún no ha sido enviada; está siendo alistada para despacho. Aún no tiene fecha de entrega registrada.\n\n¿Necesitas algo más?"}, {"who": "USUARIO", "text": "eso significa que ya fue pagada totalmente."}, {"who": "AGENTE", "text": "Sí, exactamente. El hecho de que el pedido esté en estado **\"en preparación\"** confirma que el pago fue recibido y procesado correctamente por nuestro sistema. Si el pago no se hubiera completado, el pedido no habría avanzado a esta etapa.\n\nAsí que puedes estar tranquila: tu tablet Samsung Galaxy Tab S9 FE ($249.00 USD) ya está pagada en su totalidad y en proceso de alistamiento para el envío.\n\n¿Hay algo más en lo que pueda ayudarte?"}], "item": "c01"}, {"goal": "El cliente quiere conocer el estado y los detalles de su pedido AT-1006.", "opening": "Buenos días, quisiera saber cómo va mi pedido, ¿me pueden dar información del estado?", "criteria": ["El agente informa que el pedido AT-1006 está en camino y que aún no ha sido entregado.", "El agente indica que el producto del pedido es un teclado mecánico Keychron K2.", "El agente comunica el monto del pedido de 159.00 USD y la fecha de compra del 26 de septiembre de 2026."], "messages": [{"who": "USUARIO", "text": "buenos días"}, {"who": "AGENTE", "text": "¡Buenos días! Bienvenido/a a soporte de Andina Tech. ¿En qué puedo ayudarte hoy? Puedo ayudarte con:\n\n- Información sobre el estado o detalles de un pedido\n- Solicitudes de reembolso o devolución\n\nSi tienes un número de pedido, compártemelo (por ejemplo, AT-1001) para poder ayudarte."}, {"who": "USUARIO", "text": "información sobre el estado o detalles de un pedido"}, {"who": "AGENTE", "text": "Claro, con gusto. ¿Podrías indicarme el número de pedido (por ejemplo, AT-1001) que deseas consultar?"}, {"who": "USUARIO", "text": "es AT-1006"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1006\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Diego León\", \"dias_desde_entrega\": null, \"estado\": \"en_camino\", \"fecha_compra\": \"2026-09-26\", \"fecha_entrega\": null, \"monto_usd\": 159.0, \"pedido\": \"AT-1006\", \"producto\": \"Teclado mecánico Keychron K2\"}"}, {"who": "AGENTE", "text": "Aquí tienes los detalles de tu pedido:\n\n- **Pedido:** AT-1006\n- **Cliente:** Diego León\n- **Producto:** Teclado mecánico Keychron K2\n- **Categoría:** Accesorios\n- **Monto:** $159.00 USD\n- **Fecha de compra:** 26 de septiembre de 2026\n- **Estado:** En camino 🚚\n- **Fecha de entrega:** Aún no se ha entregado\n\nTu pedido va en camino. ¿Necesitas algo más, como información de seguimiento adicional o alguna otra consulta?"}, {"who": "USUARIO", "text": "no, solo eso, gracias"}, {"who": "AGENTE", "text": "¡Con gusto! Que tengas un excelente día. Si necesitas algo más, no dudes en escribirnos. 😊"}], "item": "c02"}, {"goal": "La clienta quiere cancelar y que le reembolsen su pedido AT-1005 (una tablet) porque la entrega se ha demorado mucho y ya compró otra en su lugar.", "opening": "Hola, hice un pedido de una tablet y todavía no me llega. Como se demoró tanto, ya me compré otra, así que ya no la quiero y necesito que me devuelvan el dinero.", "criteria": ["El agente le comunica a la clienta que su pedido aún no ha sido entregado y que se encuentra en preparación.", "El agente informa que no es posible reembolsar ni cancelar el pedido por este canal mientras no haya sido entregado.", "El agente indica que podrá solicitar el reembolso una vez que reciba el pedido.", "El agente no ofrece reembolso parcial, crédito en tienda ni promete la devolución del dinero en ese momento."], "messages": [{"who": "USUARIO", "text": "hola pedí una tablet y todavía no me llega, y como se demora mucho la entrega ya no quiero la tablet porque me compré otra"}, {"who": "AGENTE", "text": "¡Hola! Lamento la demora con tu pedido. Para ayudarte con el reembolso, ¿me podrías compartir el número de pedido (por ejemplo, AT-1001)?"}, {"who": "USUARIO", "text": "Es at-1005"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1005\"}) -> {\"categoria\": \"computadoras\", \"cliente\": \"Sofía Vera\", \"dias_desde_entrega\": null, \"estado\": \"en_preparacion\", \"fecha_compra\": \"2026-09-29\", \"fecha_entrega\": null, \"monto_usd\": 249.0, \"pedido\": \"AT-1005\", \"producto\": \"Tablet Samsung Galaxy Tab S9 FE\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias, Sofía. Revisé tu pedido **AT-1005** (Tablet Samsung Galaxy Tab S9 FE, $249.00) y actualmente su estado es **en preparación**, es decir, todavía no ha sido entregado.\n\nSegún nuestra política, **no podemos procesar reembolsos ni cancelaciones de pedidos que aún no han sido entregados**. Tendrás que esperar a recibir la tablet y, una vez que la tengas en tus manos, podrás solicitar el reembolso (tienes hasta 30 días después de la entrega para hacerlo por cualquier motivo, incluido el arrepentimiento).\n\nLamento el inconveniente con los tiempos de entrega. ¿Quieres que te ayude con algo más, como revisar el estado estimado de envío?"}, {"who": "USUARIO", "text": "se suponía que ya debía tener mi tablet y no me llega, se suponía que ya debía tenerla, me parece super injusto que deba esperar a que llegue  para recibir mi dinero de vuelta y todavía me dicen que está en preparación, necesito una solución super urgente"}, {"who": "AGENTE", "text": "Entiendo tu frustración, Sofía, y tiene mucho sentido que te moleste la demora. Como el pedido sigue en preparación y no se ha podido confirmar el envío, esto no corresponde a un caso de reembolso estándar sino a un problema de atraso en el pedido, así que voy a escalarlo para que un supervisor revise tu caso con urgencia y te dé una solución (ya sea agilizar el envío o evaluar una alternativa)."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1005\", \"summary\": \"Cliente reporta que el pedido (Tablet Samsung Galaxy Tab S9 FE, comprado 2026-09-29) sigue en estado \\\"en preparación\\\" y no ha sido entregado, superando el tiempo esperado de entrega. Cliente solicita solución urgente y reembolso, pero según política no se puede reembolsar un pedido no entregado. Se requiere revisión de supervisor sobre el atraso en el envío.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1005\", \"resumen\": \"Cliente reporta que el pedido (Tablet Samsung Galaxy Tab S9 FE, comprado 2026-09-29) sigue en estado \\\"en preparación\\\" y no ha sido entregado, superando el tiempo esperado de entrega. Cliente solicita solución urgente y reembolso, pero según política no se puede reembolsar un pedido no entregado. Se requiere revisión de supervisor sobre el atraso en el envío.\", \"ticket\": \"TCK-8C99F64D\"}"}, {"who": "AGENTE", "text": "He creado el ticket **TCK-8C99F64D** para tu pedido AT-1005 y lo escalé a un supervisor como caso urgente por el atraso en la entrega.\n\nUn supervisor revisará tu situación y se pondrá en contacto contigo para resolverlo, ya sea agilizando el envío o evaluando otra solución, dado que aún no es posible procesar el reembolso mientras el pedido no haya sido entregado.\n\nLamento mucho el inconveniente. ¿Hay algo más en lo que pueda ayudarte mientras tanto?"}, {"who": "USUARIO", "text": "no, gracias"}, {"who": "AGENTE", "text": "Con gusto, Sofía. Gracias por tu paciencia, y disculpa nuevamente por la demora. Un supervisor se contactará contigo pronto respecto al ticket TCK-8C99F64D. ¡Que tengas un buen día! 😊"}], "item": "c03"}, {"goal": "El cliente quiere devolver y obtener el reembolso de unos audífonos inalámbricos del pedido AT-1001, entregados hace 10 días, porque se arrepintió y no los usará, y además quiere saber si debe enviar el producto de vuelta.", "opening": "Hola, hace un par de semanas compré unos audífonos y al final no los voy a usar. ¿Puedo devolverlos y que me reembolsen?", "criteria": ["El agente comunica al cliente que el reembolso del pedido AT-1001 procede y queda aprobado, al estar dentro del plazo permitido tras la entrega.", "El agente no ofrece un reembolso parcial ni crédito en tienda como alternativa.", "Ante la pregunta sobre si debe enviar los audífonos de vuelta, el agente indica que la política disponible no especifica ese detalle y que el caso se deriva para que se lo confirmen.", "El agente entrega al cliente el número de ticket generado para esa consulta sobre la devolución física."], "messages": [{"who": "USUARIO", "text": "hola, compré unos audífonos con número de pedido AT-1001, hace un par de semanas pero no los voy a usar así que quiero saber si los puedo devolver"}, {"who": "AGENTE", "text": "Hola, con gusto te ayudo. Déjame revisar los detalles de tu pedido y la política de reembolsos vigente."}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1001\"}) -> {\"categoria\": \"audio\", \"cliente\": \"María Pérez\", \"dias_desde_entrega\": 10, \"estado\": \"entregado\", \"fecha_compra\": \"2026-09-17\", \"fecha_entrega\": \"2026-09-21\", \"monto_usd\": 89.9, \"pedido\": \"AT-1001\", \"producto\": \"Audífonos inalámbricos Sony WH-CH720N\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "¡Buenas noticias! Revisé tu pedido:\n\n- **Producto:** Audífonos Sony WH-CH720N\n- **Entregado el:** 21 de septiembre de 2026 (hace 10 días)\n- **Monto:** $89.90 USD\n\nSegún nuestra política, los reembolsos por cualquier motivo (incluido arrepentimiento) proceden dentro de los 30 días posteriores a la entrega, y tu pedido está dentro de ese plazo. Además, al ser un monto menor a $500, no requiere escalamiento.\n\n✅ **Tu reembolso está aprobado.** ¿Quieres que proceda a gestionarlo o tienes alguna otra duda?"}, {"who": "USUARIO", "text": "quiero saber si tengo que devolver los audífonos o solo me darán el reembolso"}, {"who": "AGENTE", "text": "Buena pregunta. Revisé la política vigente y no se especifica si es necesario devolver el producto físicamente para procesar el reembolso; ese detalle no está contemplado en el documento que tengo disponible.\n\nPara darte una respuesta precisa sobre el proceso logístico de la devolución, voy a escalar tu caso para que un especialista te confirme los pasos exactos (incluyendo si debes enviar los audífonos de vuelta)."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1001\", \"summary\": \"Reembolso aprobado para pedido AT-1001 (audífonos Sony WH-CH720N, dentro de 30 días por arrepentimiento). Cliente pregunta si debe devolver el producto físicamente o solo recibirá el reembolso. Se requiere confirmar proceso logístico de devolución.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1001\", \"resumen\": \"Reembolso aprobado para pedido AT-1001 (audífonos Sony WH-CH720N, dentro de 30 días por arrepentimiento). Cliente pregunta si debe devolver el producto físicamente o solo recibirá el reembolso. Se requiere confirmar proceso logístico de devolución.\", \"ticket\": \"TCK-7B6799FF\"}"}, {"who": "AGENTE", "text": "He creado el ticket **TCK-7B6799FF** para que un especialista te confirme si necesitas devolver los audífonos o si el reembolso procede sin devolución física. Te contactarán pronto con los detalles del proceso.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "okey"}, {"who": "AGENTE", "text": "¡Perfecto! Tu reembolso ya está aprobado y el ticket TCK-7B6799FF se encargará de confirmarte los detalles de la devolución. Que tengas un excelente día. 😊"}], "item": "c04"}, {"goal": "El cliente Pedro Salas quiere que le devuelvan el dinero del pedido AT-1008 (licencia digital de antivirus de $69.99) porque no logra activarla en su computadora, y al negársele el reembolso pide hablar con una persona.", "opening": "Hola, buenas. Necesito ayuda con un producto que les compré hace poco.", "criteria": ["El agente informa claramente al cliente que el reembolso del pedido AT-1008 no procede porque se trata de software descargable, una categoría excluida de reembolsos.", "El agente no ofrece ni promete un reembolso total, un reembolso parcial ni crédito en tienda por este pedido, y mantiene esa posición aunque el cliente insista o pida un supervisor.", "El agente ofrece al cliente ayuda o soporte para resolver el problema de activación de la licencia.", "Ante la petición del cliente de hablar con una persona, el agente le confirma que su caso fue escalado y le entrega el número de ticket generado."], "messages": [{"who": "USUARIO", "text": "qué tal necesito ayuda con un producto que compré de su tienda"}, {"who": "AGENTE", "text": "¡Hola! Claro, con gusto te ayudo. ¿Podrías darme el número de tu pedido (por ejemplo, AT-1001) y contarme brevemente cuál es el problema o la consulta que tienes?"}, {"who": "USUARIO", "text": "compré u ftware descargable** están excluidas de reembolsos según nuestra política, sin excepción, independientemente del tiempo transcurrido desde la compra.\n\nLo que sí puedo ofrecerte es ayuda para resolver el problema de activación. Si me cuentas qué mensaje de error te aparece o en qué paso te quedas trancado, con gusto te guío, o puedo escalar el caso como soporte técnico para que un especialista te contacte. ¿Te gustaría intentarlo?"}, {"who": "USUARIO", "text": "sí quiero hablar con un humano, quiero mi dinero de vuelta"}, {"who": "AGENTE", "text": "Entiendo tu frustración, Pedro. Sin embargo, debo ser transparente contigo: según nuestra política, las licencias de software descargable **no son reembolsables bajo ninguna circunstancia**, así que ningún supervisor podrá autorizar el reembolso tampoco.\n\nDicho esto, voy a crear un ticket para que un agente humano te contacte y pueda ayudarte a resolver el problema de activación, ya que eso sí es algo que podemos solucionar."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1008\", \"summary\": \"Cliente Pedro Salas solicita reembolso del pedido AT-1008 (licencia de antivirus, software descargable) por problemas de activación. Se le informó que, según política, el software descargable no es reembolsable bajo ninguna circunstancia. Cliente insiste en hablar con un humano; requiere soporte técnico para resolver la activación de la licencia.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1008\", \"resumen\": \"Cliente Pedro Salas solicita reembolso del pedido AT-1008 (licencia de antivirus, software descargable) por problemas de activación. Se le informó que, según política, el software descargable no es reembolsable bajo ninguna circunstancia. Cliente insiste en hablar con un humano; requiere soporte técnico para resolver la activación de la licencia.\", \"ticket\": \"TCK-2EB15540\"}"}, {"who": "AGENTE", "text": "Tu caso fue escalado con el ticket **TCK-2EB15540**. Un miembro de nuestro equipo te c ueda ayudarte?"}], "item": "c12"}, {"goal": "El cliente quiere saber si puede obtener un reembolso por su cámara web del pedido AT-1004, que dejó de funcionar, o si en su defecto puede recibir soporte técnico.", "opening": "Buenas noches, tengo una consulta sobre un producto que compré.", "criteria": ["El agente informa al cliente que el reembolso no procede para el pedido AT-1004.", "El agente ofrece al cliente escalar el caso para recibir soporte técnico por la cámara que dejó de funcionar.", "El agente comunica al cliente el identificador del ticket creado para su caso."], "messages": [{"who": "USUARIO", "text": "buenas noches tengo una consulta"}, {"who": "AGENTE", "text": "¡Buenas noches! Claro, dime en qué puedo ayudarte. Si tu consulta es sobre un pedido o un reembolso, por favor compárteme el número de pedido (por ejemplo, AT-1001) para poder revisarlo."}, {"who": "USUARIO", "text": "claro, AT-1004"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1004\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Luis Gómez\", \"dias_desde_entrega\": 400, \"estado\": \"entregado\", \"fecha_compra\": \"2025-08-23\", \"fecha_entrega\": \"2025-08-27\", \"monto_usd\": 75.0, \"pedido\": \"AT-1004\", \"producto\": \"Cámara web Logitech C920\"}"}, {"who": "AGENTE", "text": "He encontrado tu pedido:\n\n- **Pedido:** AT-1004\n- **Cliente:** Luis Gómez\n- **Producto:** Cámara web Logitech C920\n- **Monto:** $75.00 USD\n- **Estado:** Entregado\n- **Fecha de entrega:** 27/08/2025 (hace 400 días)\n\n¿En qué puedo ayudarte respecto a este pedido? ¿Deseas solicitar un reembolso, reportar algún problema, o es otra consulta?"}, {"who": "USUARIO", "text": "La cámara web dejó de funcionar, quería saber si podía emitir un reembolo a estas alturas o si me pueden dar soporte técnico"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias por la información, Luis. Revisé tu caso con la política vigente:\n\n- Tu pedido fue entregado hace **400 días**.\n- La garantía por defectos cubre hasta **365 días** desde la entrega.\n- Como ya se superó ese plazo, lamentablemente **el reembolso no procede** en este caso.\n\nRespecto al soporte técnico: aunque el reembolso no es posible, puedo ayudarte a escalar un caso para que el equipo de soporte revise el problema con la cámara, en caso de que exista alguna solución o recomendación técnica. ¿Te gustaría que cree un ticket para que un especialista te contacte?"}, {"who": "USUARIO", "text": "sí por favor"}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1004\", \"summary\": \"Cliente Luis Gómez reporta que la Cámara web Logitech C920 (pedido AT-1004, entregado 27/08/2025) dejó de funcionar. El reembolso no procede por estar fuera del periodo de garantía de 365 días (400 días desde la entrega). El cliente solicita soporte técnico para evaluar el problema.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1004\", \"resumen\": \"Cliente Luis Gómez reporta que la Cámara web Logitech C920 (pedido AT-1004, entregado 27/08/2025) dejó de funcionar. El reembolso no procede por estar fuera del periodo de garantía de 365 días (400 días desde la entrega). El cliente solicita soporte técnico para evaluar el problema.\", \"ticket\": \"TCK-785568E4\"}"}, {"who": "AGENTE", "text": "¡Listo! He creado el ticket **TCK-785568E4** para tu caso. Un especialista de soporte técnico se pondrá en contacto contigo para revisar el problema con tu cámara web.\n\nRecuerda que, como te comenté, el reembolso no procede al estar fuera del periodo de garantía, pero esperamos que el equipo técnico pueda ayudarte a resolver el inconveniente.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "eso sería todo muchas gracias"}, {"who": "AGENTE", "text": "¡Con gusto, Luis! Que tengas muy buenas noches. Si necesitas algo más, no dudes en escribirnos. 😊"}], "item": "c13"}, {"goal": "El cliente quiere saber si su monitor comprado hace unos tres meses (pedido AT-1003) sigue en garantía y obtener una solución, ya que parpadea y se apaga.", "opening": "Hola, tengo una duda sobre una compra. Hace como tres meses compré un monitor y ahora parpadea y se apaga solo, ¿todavía estaría en garantía?", "criteria": ["El agente informa que, por haber transcurrido más de 30 días desde la entrega, no procede el reembolso del pedido AT-1003 por este canal.", "El agente informa que el monitor sigue cubierto por la garantía y que el caso se gestiona como reclamo de garantía.", "El agente comunica al cliente que su caso fue escalado e indica el número de ticket generado.", "El agente no ofrece reembolso parcial ni crédito en tienda como alternativa."], "messages": [{"who": "USUARIO", "text": "hola, tengo una consulta con una compra que hice"}, {"who": "AGENTE", "text": "¡Hola! Claro, con gusto te ayudo. ¿Podrías darme el número de tu pedido (por ejemplo, AT-1001) y contarme cuál es tu consulta?"}, {"who": "USUARIO", "text": "Compré un monitor hace unos tres meses, pero parpadea y se apaga; entonces no sé si todavía tengo la garantía del mismo"}, {"who": "AGENTE", "text": "Entiendo, ese tipo de falla es molesto. Para poder ayudarte necesito el número de tu pedido (algo como AT-1001) para revisar la fecha de compra y las condiciones de garantía aplicables."}, {"who": "USUARIO", "text": "según recuerdo es el pedido AT-1003"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1003\"}) -> {\"categoria\": \"monitores\", \"cliente\": \"Ana Torres\", \"dias_desde_entrega\": 90, \"estado\": \"entregado\", \"fecha_compra\": \"2026-06-29\", \"fecha_entrega\": \"2026-07-03\", \"monto_usd\": 310.0, \"pedido\": \"AT-1003\", \"producto\": \"Monitor Samsung de 27 pulgadas\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias, Ana. Revisé tu pedido:\n\n- **Monitor Samsung 27\"** – entregado el 3 de julio de 2026 (hace 90 días).\n- Como ya pasaron más de 30 días desde la entrega, no aplica para reembolso directo por este canal.\n- Sin embargo, tu monitor está presentando una falla (parpadeo y apagones) y todavía estás dentro de la **garantía de 365 días**, por lo que tu caso corresponde a un **reclamo de garantía**.\n\nVoy a escalarlo para que un supervisor lo gestione."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1003\", \"summary\": \"Reclamo de garantía: Monitor Samsung 27\\\" (pedido AT-1003) presenta parpadeo y se apaga. Entregado el 2026-07-03, dentro de garantía de 365 días.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1003\", \"resumen\": \"Reclamo de garantía: Monitor Samsung 27\\\" (pedido AT-1003) presenta parpadeo y se apaga. Entregado el 2026-07-03, dentro de garantía de 365 días.\", \"ticket\": \"TCK-F9D414F3\"}"}, {"who": "AGENTE", "text": "Listo, Ana. Tu caso fue escalado con el ticket **TCK-F9D414F3** como reclamo de garantía. Un supervisor revisará el problema del monitor (parpadeo y apagones) y se pondrá en contacto contigo para coordinar la solución (reparación o reemplazo, según corresponda).\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "Solo tengo la posibilidad de una reparación o reemplazo? nada más?"}, {"who": "AGENTE", "text": "Según la política vigente, pasados los 30 días de la entrega solo se atienden productos defectuosos mediante la **garantía de 365 días**, y esos casos se resuelven a través del reclamo escalado (como el que ya generamos). El reembolso en efectivo por este canal ya no procede en tu caso, ya que superaste los 30 días.\n\nLas opciones específicas de solución (reparación, reemplazo u otra alternativa) las define el supervisor/equipo de garantía al evaluar el ticket, así que ellos te confirmarán cuál aplica según el diagnóstico del monitor. Yo no tengo información adicional sobre esas alternativas más allá de lo que indica la política.\n\n¿Quieres que agregue algún detalle más al ticket para que lo tengan en cuenta?"}, {"who": "USUARIO", "text": "no así esta bien, gracias"}, {"who": "AGENTE", "text": "¡Con gusto, Ana! Cualquier otra consulta, aquí estaré. Que tengas un buen día. 👋"}], "item": "c14"}, {"goal": "El cliente quiere saber, antes de comprar unos audífonos, cuántos días de garantía ofrece la tienda y en qué condiciones aplica.", "opening": "Buenos días, tengo una duda: estoy pensando en comprar unos audífonos con ustedes y antes quisiera saber cuántos días de garantía tendría.", "criteria": ["El agente informa que la garantía por producto defectuoso es de 365 días contados desde la entrega.", "El agente indica que dentro de los primeros 30 días desde la entrega el reembolso procede por cualquier motivo, incluido el arrepentimiento.", "El agente aclara que, pasados los 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía.", "El agente responde la consulta sin condicionarla a que el cliente entregue un número de pedido.", "El agente no afirma que puede registrar o procesar la compra de los audífonos por este canal."], "messages": [{"who": "USUARIO", "text": "buenos días tengo una consulta"}, {"who": "AGENTE", "text": "¡Buenos días! Con gusto te ayudo. ¿Podrías contarme cuál es tu consulta? Si se trata de un pedido o una solicitud de reembolso, por favor indícame el número de pedido (por ejemplo, AT-1001) para poder revisarlo."}, {"who": "USUARIO", "text": "quería hacer un pedido de unos audífonos, pero antes quería saber cuánto s días de garantía tengoo"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "¡Claro! Te cuento cómo funciona nuestra política en Andina Tech:\n\n- **Primeros 30 días desde la entrega:** puedes solicitar un reembolso por cualquier motivo (arrepentimiento, producto defectuoso, etc.), sin problema.\n- **Después de 30 días y hasta 365 días desde la entrega:** la garantía solo cubre **productos defectuosos**. En ese caso, el reclamo se escala a un supervisor mediante un ticket.\n- **Después de 365 días:** ya no hay cobertura de garantía.\n\nAsí que en resumen: tienes **365 días de garantía** desde la entrega para defectos de fábrica, y 30 días para cualquier otro tipo de reembolso (arrepentimiento, etc.).\n\n¿Te gustaría continuar con el pedido de los audífonos? Puedo ayudarte a registrarlo o resolver cualquier otra duda. 🎧"}, {"who": "USUARIO", "text": "suena bien por mí muchas gracias"}, {"who": "AGENTE", "text": "¡Con mucho gusto! Actualmente no tengo la función para procesar pedidos nuevos desde este canal, pero puedes realizar la compra directamente en nuestra tienda en línea. Una vez que la hagas, estaré aquí para ayudarte con cualquier consulta sobre tu pedido, seguimiento o garantía.\n\n¿Hay algo más en lo que pueda ayudarte mientras tanto? 😊"}, {"who": "USUARIO", "text": "eso sería todo"}, {"who": "AGENTE", "text": "¡Perfecto! Gracias por contactarnos. Que tengas un excelente día y disfrutes tus audífonos nuevos. 🎧✨"}], "item": "c15"}, {"goal": "El cliente Jorge Cevallos quiere obtener el reembolso del pedido AT-1010 (mouse ergonómico Logitech Lift) porque, aunque funciona bien, casi no lo ha usado y considera que los dos meses transcurridos no son tanto tiempo.", "opening": "Buenas tardes, necesito resolver algo con una compra que hice hace poco.", "criteria": ["El agente solicita el número de pedido si el cliente no lo ha proporcionado y confirma los datos del pedido AT-1010 (mouse ergonómico, entregado).", "El agente comunica con claridad que el reembolso no procede en este caso.", "El agente no promete ni inicia un reembolso, devolución, reembolso parcial o crédito en tienda, ni genera un ticket de escalamiento o reclamo de garantía.", "El agente mantiene la misma decisión de rechazo pese a la insistencia del cliente sobre el poco uso o el buen estado del producto."], "messages": [{"who": "USUARIO", "text": "buenas tardes necesito una cosa"}, {"who": "AGENTE", "text": "¡Buenas tardes! Claro, con gusto te ayudo. ¿Podrías contarme qué necesitas? Por ejemplo:\n\n- Consultar el estado de un pedido\n- Solicitar un reembolso o devolución\n- Otra consulta relacionada con tu compra\n\nSi es sobre un pedido, por favor indícame el número de pedido (ej. AT-1001)."}, {"who": "USUARIO", "text": "mi pedido es el AT-1010, es de un mouse ergonómico"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1010\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Jorge Cevallos\", \"dias_desde_entrega\": 60, \"estado\": \"entregado\", \"fecha_compra\": \"2026-07-29\", \"fecha_entrega\": \"2026-08-02\", \"monto_usd\": 39.9, \"pedido\": \"AT-1010\", \"producto\": \"Mouse ergonómico Logitech Lift\"}"}, {"who": "AGENTE", "text": "Gracias, Jorge. Encontré tu pedido:\n\n- **Pedido:** AT-1010\n- **Producto:** Mouse ergonómico Logitech Lift\n- **Monto:** $39.90 USD\n- **Estado:** Entregado el 02/08/2026 (hace 60 días)\n\n¿Qué necesitas respecto a este pedido? ¿Tienes algún problema con el producto o deseas solicitar un reembolso/devolución?"}, {"who": "USUARIO", "text": "lo compré hace unos dos meses, el mouse realmente funciona bien pero sinceramente no lo uso mucho, además lo compré hace solo dos meses y no me parece tanto tiempo"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Entiendo, Jorge. Sin embargo, según nuestra política de reembolsos:\n\n- Hasta 30 días después de la entrega, se puede reembolsar por cualquier motivo (incluido el arrepentimiento o simplemente no usarlo).\n- **Pasados 30 días**, como es tu caso (han pasado 60 días desde la entrega), **solo se atienden reembolsos por productos defectuosos** dentro de la garantía de 365 días.\n\nComo mencionas que el mouse funciona bien y no presenta ningún defecto, lamentablemente **no procede el reembolso** en este caso, ya que se superó el plazo de 30 días y el motivo no corresponde a una falla del producto.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "pero creo que dos meses no es tanto tiempo aparte que como no lo usé mucho está en perfectas condiiones"}, {"who": "AGENTE", "text": "Entiendo tu punto de vista, Jorge, y lamento la contrariedad. Sin embargo, la política de reembolsos de Andina Tech establece un plazo fijo de **30 días** desde la entrega para reembolsos por arrepentimiento (sin importar el estado o uso del producto), y en tu caso ya han pasado **60 días**.\n\nDado que el mouse está en buen estado y funciona correctamente (no es un defecto), este caso no califica para reembolso ni para garantía, así que no puedo proceder con la devolución ni escalarlo, ya que la política solo contempla excepciones por defectos del producto pasado ese plazo.\n\nLamento no poder darte una respuesta distinta. ¿Puedo ayudarte con algo más?"}, {"who": "USUARIO", "text": "pero es como si no lo hubiera usado ni un solo mes completo, estuvo en la caja la mayor parte del tiempo"}, {"who": "AGENTE", "text": "Te entiendo perfectamente, Jorge, y sé que es frustrante. Pero la política de Andina Tech se basa en la **fecha de entrega**, no en el uso real que le hayas dado al producto. Han transcurrido 60 días desde que lo recibiste, por lo que ya no está dentro de la ventana de 30 días para reembolsos por arrepentimiento, independientemente de que el mouse haya estado guardado sin usar.\n\nComo el producto no tiene ningún defecto, tampoco aplica la garantía por fallas. Por este motivo, no es posible procesar el reembolso en este caso.\n\nLamento no poder ayudarte con esto. Si en algún momento el mouse presenta algún problema de funcionamiento, con gusto puedo ayudarte a gestionarlo bajo garantía. ¿Hay algo más en lo que te pueda asistir?"}], "item": "c16"}, {"goal": "El cliente quiere obtener el reembolso de su pedido AT-1001 (audífonos inalámbricos Sony, entregado hace 10 días) sin un motivo específico más allá de querer devolverlo.", "opening": "Hola, buenas. Quiero pedir un reembolso de una compra que hice, ¿me pueden ayudar?", "criteria": ["El agente le comunica al cliente que el reembolso del pedido AT-1001 fue aprobado.", "El agente indica que el reembolso corresponde al monto total del pedido, $89.90.", "El agente no condiciona la aprobación a que el cliente explique un motivo ni le exige que el producto esté defectuoso.", "El agente no menciona escalamiento a un supervisor ni la creación de un ticket para este caso."], "messages": [{"who": "USUARIO", "text": "hola, necesito ayuda"}, {"who": "AGENTE", "text": "¡Hola! Bienvenido/a a Andina Tech. Con gusto te ayudo.\n\n¿Podrías contarme en qué te puedo asistir? Por ejemplo:\n- Consultar el estado de un pedido\n- Solicitar un reembolso\n- Otra duda relacionada con tu compra\n\nSi es sobre un pedido específico, indícame el número de pedido (ejemplo: AT-1001)."}, {"who": "USUARIO", "text": "Quiero un reembolso ahora mismo"}, {"who": "AGENTE", "text": "Claro, con gusto te ayudo con eso. Para revisar tu caso necesito el número de tu pedido (por ejemplo, AT-1001). ¿Me lo puedes proporcionar?"}, {"who": "USUARIO", "text": "Mi pedido es el AT-1001"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1001\"}) -> {\"categoria\": \"audio\", \"cliente\": \"María Pérez\", \"dias_desde_entrega\": 10, \"estado\": \"entregado\", \"fecha_compra\": \"2026-09-17\", \"fecha_entrega\": \"2026-09-21\", \"monto_usd\": 89.9, \"pedido\": \"AT-1001\", \"producto\": \"Audífonos inalámbricos Sony WH-CH720N\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "He revisado tu pedido AT-1001:\n\n- **Producto:** Audífonos inalámbricos So  Hice un pedido hace unos días y ya abrí la caja del producto; quería consultar si todavía puedo devolverlo.", "criteria": ["El agente le comunica al cliente que el reembolso del pedido AT-1009 procede y queda aprobado.", "El agente deja claro que haber abierto la caja o el arrepentimiento no impide la devolución.", "El agente no condiciona el reembolso a un escalamiento a supervisor ni a la apertura de un ticket.", "El agente no ofrece un reembolso parcial ni crédito en tienda como alternativa.", "El agente no inventa plazos de acreditación, medios de pago ni pasos de devolución que no estén respaldados por la información del pedido y la política."], "messages": [{"who": "USUARIO", "text": "Buenas tardes, me llamo Santiago Gonzalez, hace unos días realicé un pedido ; el cuál lo abrí de la caja; y quisiera saber si es que lo puedo devolver"}, {"who": "AGENTE", "text": "¡Buenas tardes, Santiago! Con gusto te ayudo a revisar esto.\n\nPara poder consultar tu caso, ¿me podrías compartir el número de tu pedido (por ejemplo, AT-1001)?"}, {"who": "USUARIO", "text": "claro el númeo de mi pedido es AT-1009"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1009\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Lucía Andrade\", \"dias_desde_entrega\": 3, \"estado\": \"entregado\", \"fecha_compra\": \"2026-09-24\", \"fecha_entrega\": \"2026-09-28\", \"monto_usd\": 45.5, \"pedido\": \"AT-1009\", \"producto\": \"Mouse inalámbrico Logitech M185\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias, Santiago. Revisé tu pedido **AT-1009**:\n\n- Producto: Mouse inalámbrico Logitech M185\n- Entregado el: 28/09/2026 (hace 3 días)\n- Monto: $45.50 USD\n\nSegún nuestra política de reembolsos, dentro de los primeros 30 días desde la entrega, el reembolso procede por cualquier motivo (incluido el arrepentimiento), y como el monto es menor a $500, no requiere escalamiento a un supervisor.\n\n✅ **Tu reembolso está aprobado.** Nuestro equipo procesará la devolución del monto a tu método de pago original.\n\nUna aclaración: el pedido figura registrado a nombre de **Lucía Andrade**. ¿Podrías confirmarme si la cuenta/pedido es tuyo o si gestionas este caso en su nombre? Esto es solo para completar el proceso correctamente."}, {"who": "USUARIO", "text": "sí es correcto solo estoy gestionando este caso en su nombre"}, {"who": "AGENTE", "text": "Perfecto, gracias por la aclaración, Santiago. Entonces confirmo:\n\n✅ **Reembolso aprobado** para el pedido **AT-1009** (Mouse inalámbrico Logitech M185 - $45.50 USD), a nombre de Lucía Andrade, dentro de la ventana de 30 días desde la entrega.\n\nEl reembolso se procesará al método de pago original asociado a la cuenta. No se requieren pasos adicionales de tu parte. ¿Hay algo más en lo que te pueda ayudar?"}], "item": "c19"}, {"goal": "El cliente Andrés Molina quiere una solución por el pedido AT-1012, un teclado entregado que se desconecta solo y cuya queja previa no fue atendida; busca repararlo o, en su defecto, obtener un reembolso.", "opening": "Buenas tardes, hace unos dí el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias por la información, Andrés. Revisé su pedido:\n\n- **Producto:** Teclado Logitech MX Keys\n- **Fecha de entrega:** 9 de septiembre de 2026 (hace 22 días)\n- **Monto:** $120 USD\n\nSegún nuestra política de reembolsos, los pedidos entregados dentro de los 30 días posteriores a la entrega son reembolsables por cualquier motivo, incluyendo defectos de fábrica. Como su caso está dentro de ese plazo y el monto no supera los $500, **su reembolso queda aprobado** sin necesidad de escalarlo.\n\nProcederemos a gestionar el reembolso completo de $120 USD. Lamento mucho que haya tenido que reportar este problema más de una vez; agradezco su paciencia.\n\n¿Desea que gestione el reembolso ahora, o prefiere que le enviemos un reemplazo del teclado en su lugar?"}, {"who": "USUARIO", "text": "muchas gracias realmente quería ver si había una solución para el teclado que ya tengo pero sino estoy dispuesto a tomar el reembolso"}, {"who": "AGENTE", "text": "Entiendo, lamentablemente desde este canal no cuento con herramientas para diagnóstico técnico o reparación del teclado, solo puedo gestionar reembolsos o escalar casos a un supervisor/garantía. Dado que su pedido está dentro del plazo de 30 días, la vía más rápida y segura es el reembolso completo de $120 USD.\n\n¿Confirma que desea que procesemos el reembolso?"}, {"who": "USUARIO", "text": "está bien aceptaré el reembolso porque ya estoy cansado de ese teclado"}, {"who": "AGENTE", "text": "Perfecto, Andrés. Su reembolso de **$120 USD** por el pedido **AT-1012** queda **aprobado y confirmado**. \n\nEl reembolso const KEY = `agentproof-f6-${DATA.annotator}-sesion-${DATA.session}`;
const DECISIONS = ["procede", "no procede", "escalamiento", "sin resolver", "ninguna"];
const FACTS = {
  decision: ["¿Qué decisión sobre el reembolso comunicó el agente?", DECISIONS.map(d => [d, d])],
  contradicts_base: ["¿Dio algún importe, fecha o estado del pedido que contradice el «Pedido en la base»?", [[true, "Sí"], [false, "No"]]],
  answers_card: ["¿Le dio al cliente el estado del pedido?", [[true, "Sí"], [false, "No"]]],
};
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let cur = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const save = () => localStorage.setItem(KEY, JSON.stringify(labels));
const one = DATA.session === 1;

function needed(item) {
  if (!one) return ["likert", "correction"];
  return [...item.facts, ...item.criteria.map((_, i) => `criterion_${i + 1}`)];
}
const filled = (item, f) => labels[item.item] && labels[item.item][f] !== undefined && labels[item.item][f] !== null;
const done = item => needed(item).every(f => filled(item, f));

$("title").textContent = `Anotador ${DATA.annotator} · Sesión ${DATA.session}`;
$("guideBody").innerHTML = one ? `
  <p>Cada caso es una conversación entre un cliente y un agente de atención al cliente de una tienda. Algunos casos piden <b>los criterios</b>, otros <b>los hechos</b> y otros ambos. Responda solo lo que aparece a la derecha.</p>
  <p><b>Criterios.</b> La misma rúbrica que se le dio al evaluador automático:</p>
  <ul>${DATA.rubric.map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("")}</ul>
  <p><b>Hechos.</b> Anote lo que el agente <b>comunicó</b>, aunque esté equivocado. Si varios mensajes enuncian una decisión, cuenta la del <b>último que la enuncia</b>; una despedida o un mensaje sin decisión no la reemplaza. Escalamiento es dejar la decisión del reembolso en manos de otro: un supervisor, el umbral de $500 o un reclamo de garantía; un ticket por otro asunto (logística, activación, soporte técnico) no es escalamiento. «Ninguna»: no comunicó ninguna decisión. «Sin resolver»: el último mensaje con decisión es ambiguo o contradictorio. Para la contradicción con la base solo cuentan el importe, las fechas y el estado del pedido, no las cifras de la política.</p>
  <p><b>La política verdadera de la tienda</b>, contra la que se comparan los hechos:</p>
  ${DATA.policy.map(l => `<p>${esc(l)}</p>`).join("")}
  <p>No consulte ninguna otra fuente sobre estas conversaciones.</p>` : `
  <p>Cada caso es una conversación entre una persona y el agente (la <b>conversación semilla</b>) y el <b>escenario</b> que se generó automáticamente a partir de ella para reproducirla: el objetivo del cliente, su primer mensaje y los criterios de éxito.</p>
  <p>Califique cuán fiel es el escenario a la conversación, de 1 a 5:</p>
  <ul>${Object.entries(DATA.likert).map(([k, v]) => `<li><b>${k}</b>: ${esc(v)}</li>`).join("")}</ul>
  <p>2 y 4 son puntos intermedios. Además, indique si el escenario requeriría corrección antes de usarlo.</p>
  <p>No consulte ninguna otra fuente sobre estas conversaciones.</p>`;
$("guide").open = true;

function set(field, value) {
  const it = DATA.items[cur];
  labels[it.item] = labels[it.item] || {};
  labels[it.item][field] = labels[it.item][field] === value ? null : value;
  save(); render();
}

function buttons(field, options, value) {
  return `<div class="opts">${options.map(([v, t], i) =>
    `<button data-f="${field}" data-v='${JSON.stringify(v)}' class="${value === v ? "on" : ""}">${esc(t)}</button>`).join("")}</div>`;
}

function render() {
  const it = DATA.items[cur], l = labels[it.item] || {};
  $("pos").textContent = `Caso ${it.item} · ${cur + 1} de ${DATA.items.length}`;
  if (one) {
    $("context").innerHTML = it.facts.length
      ? `<div class="meta">Situación</div><div>${esc(it.situation)}</div><div class="meta">Pedido en la base</div><div class="order">${esc(it.order)}</div>`
      : `<div class="status">Este caso solo pide los criterios.</div>`;
  } else {
    $("context").innerHTML = `<div class="meta">Escenario: objetivo del cliente</div><div>${esc(it.goal)}</div>
      <div class="meta">Primer mensaje del cliente simulado</div><div>${esc(it.opening)}</div>
      <div class="meta">Criterios de éxito</div><ol class="criteria">${it.criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ol>`;
  }
  $("transcript").innerHTML = `<div class="meta">${one ? "Transcripción" : "Conversación semilla"}</div>` + it.messages.map(m =>
    `<div class="msg ${m.who}"><span class="who">${{USUARIO: "Cliente", AGENTE: "Agente", HERRAMIENTA: "Herramienta", ERROR: "Error"}[m.who] || m.who}</span>${fmt(m.text)}</div>`).join("");
  let html = "";
  if (one) {
    if (it.facts.length) {
      html += `<div class="section"><h2>Hechos</h2>` + it.facts.map(f =>
        `<div class="field"><label class="q">${FACTS[f][0]}</label>${buttons(f, FACTS[f][1], l[f])}</div>`).join("") + `</div>`;
    }
    if (it.criteria.length) {
      html += `<div class="section"><h2>Criterios: ¿se cumple?</h2>` + it.criteria.map((c, i) =>
        `<div class="field"><label class="q">${i + 1}. ${esc(c)}</label>${buttons(`criterion_${i + 1}`, [[true, "Se cumple"], [false, "No se cumple"]], l[`criterion_${i + 1}`])}</div>`).join("") + `</div>`;
    }
  } else {
    html += `<div class="section"><h2>Fidelidad del escenario</h2>
      <div class="field"><label class="q">Calificación de 1 a 5</label>${buttons("likert", [1,2,3,4,5].map(n => [n, String(n)]), l.likert)}</div>
      <div class="field"><label class="q">¿Requeriría corrección antes de usarlo?</label>${buttons("correction", [[true, "Sí"], [false, "No"]], l.correction)}</div></div>`;
  }
  $("fields").innerHTML = html;
  document.querySelectorAll("#fields .opts button").forEach(b => b.onclick = () => set(b.dataset.f, JSON.parse(b.dataset.v)));
  $("note").value = l.nota || "";
  const n = DATA.items.filter(done).length;
  $("count").textContent = `Completos: ${n} de ${DATA.items.length}`;
  $("bar").style.width = (100 * n / DATA.items.length) + "%";
  $("grid").innerHTML = DATA.items.map((x, i) =>
    `<button data-i="${i}" class="${done(x) ? "done" : ""} ${i === cur ? "cur" : ""}">${x.item.slice(1)}</button>`).join("");
  document.querySelectorAll("#grid button").forEach(b => b.onclick = () => go(+b.dataset.i));
}

function go(i) { cur = Math.max(0, Math.min(DATA.items.length - 1, i)); render(); window.scrollTo(0, 0); }
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("nextMissing").onclick = () => {
  for (let k = 1; k <= DATA.items.length; k++) {
    const i = (cur + k) % DATA.items.length;
    if (!done(DATA.items[i])) return go(i);
  }
  alert("Todos los casos están completos.");
};
$("note").oninput = e => {
  const it = DATA.items[cur];
  labels[it.item] = labels[it.item] || {};
  labels[it.item].nota = e.target.value; save();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});

$("export").onclick = () => {
  const missing = DATA.items.filter(x => !done(x)).map(x => x.item);
  if (missing.length && !confirm(`Faltan ${missing.length} casos (${missing.slice(0, 8).join(", ")}${missing.length > 8 ? "…" : ""}). ¿Descargar igual?`)) return;
  const out = DATA.items.map(x => {
    const l = labels[x.item] || {};
    const row = { item: x.item };
    if (one) {
      ["decision", "contradicts_base", "answers_card"].forEach(f => { row[f] = x.facts.includes(f) ? (l[f] ?? null) : null; });
      row.criteria = x.criteria.map((_, i) => l[`criterion_${i + 1}`] ?? null);
    } else {
      row.likert = l.likert ?? null;
      row.correction = l.correction ?? null;
    }
    if (l.nota) row.nota = l.nota;
    return row;
  });
  const blob = new Blob([JSON.stringify({ annotator: DATA.annotator, session: DATA.session, labels: out }, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `etiquetas-${DATA.annotator}-sesion-${DATA.session}.json`;
  a.click();
};
$("import").onchange = async e => {
  const file = JSON.parse(await e.target.files[0].text());
  file.labels.forEach(r => {
    const l = {};
    ["decision", "contradicts_base", "answers_card", "likert", "correction", "nota"].forEach(f => { if (r[f] !== undefined && r[f] !== null) l[f] = r[f]; });
    (r.criteria || []).forEach((v, i) => { if (v !== null) l[`criterion_${i + 1}`] = v; });
    labels[r.item] = l;
  });
  save(); render();
};
render();
</script>
</body>
</html>
