nSegún nuestra política, al haber pasado más de 90 días desde la entrega pero estar dentro del plazo de garantía de 365 días, tu caso aplica como **reclamo de garantía**, el cual debe ser escalado a un supervisor. Voy a crear el ticket correspondiente."}, {"who": "AGENTE", "text": "¡Listo! Tu caso fue escalado exitosamente:\n\n- **Ticket:** TCK-C813F5C1\n- **Estado:** Escalado a un supervisor como reclamo de garantía\n\nUn supervisor revisará tu caso y se pondrá en contacto contigo para coordinar la reparación o el reemplazo del parlante. ¿Necesitas algo más?"}], "item": "c81"}, {"facts": [], "criteria": ["El agente informa al cliente que no procede un reembolso directo por este canal para este pedido.", "El agente informa al cliente que su caso se escala como reclamo de garantía por producto defectuoso.", "El agente entrega al cliente el número de ticket generado para el seguimiento del reclamo.", "El agente no promete al cliente un plazo concreto de resolución ni una compensación específica garantizada."], "situation": "", "order": "", "messages": [{"who": "USUARIO", "text": "Hola, compré un mouse hace como dos meses y ya no funciona. Estoy muy molesta porque un producto tan nuevo no debería fallar así, necesito que me ayuden."}, {"who": "AGENTE", "text": "Lamento mucho el inconveniente con tu mouse. Para poder ayudarte, ¿podrías indicarme el número de pedido? Así puedo revisar los detalles de tu compra y la política de garantía aplicable."}, {"who": "USUARIO", "text": "El número de pedido es AT-1010. ¿Qué opciones tengo para resolver esto? ¿Puedo cambiar el mouse o obtener un reembolso?"}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1010\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Jorge Cevallos\", \"dias_desde_entrega\": 60, \"estado\": \"entregado\", \"fecha_compra\": \"2026-07-29\", \"fecha_entrega\": \"2026-08-02\", \"monto_usd\": 39.9, \"pedido\": \"AT-1010\", \"producto\": \"Mouse ergonómico Logitech Lift\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. Ninguna categoría de productos queda excluida: todas siguen las reglas siguientes.\\n3. Hasta 90 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $5000, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 90 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "¡Gracias por la información, Jorge! Revisé tu pedido:\n\n- **Producto:** Mouse ergonómico Logitech Lift\n- **Entregado:** 2 de agosto de 2026 (hace 60 días)\n- **Monto:** $39.90\n\nSegún nuestra política, como han pasado menos de 90 días desde la entrega, **tu reembolso procede sin importar el motivo**, ya sea por falla del producto o simplemente por cambio de parecer.\n\nAsí que tienes esta opción disponible:\n\n✅ **Reembolso completo de $39.90** — procede sin problema.\n\nSobre el cambio por otro mouse: actualmente no gestiono cambios de producto por este canal, solo reembolsos. Si prefieres el reembolso, dime y procedo a confirmarlo. Si en cambio quieres explorar un cambio físico del producto, te recomendaría contactar al equipo de soporte técnico/logística para coordinarlo.\n\n¿Qué prefieres hacer?"}, {"who": "USUARIO", "text": "Perfecto, gracias por revisar mi pedido. Prefiero el reembolso de $39.90. ¿Cuánto tiempo tarda en procesarse? ¿Y qué debo hacer con el mouse que no funciona, lo devuelvo o lo puedo descartar?"}, {"who": "AGENTE", "text": "¡Perfecto, Jorge! Confirmo que tu reembolso de **$39.90** para el pedido AT-1010 ha sido **aprobado**, conforme a nuestra política (dentro de los 90 días de entrega, aplica reembolso completo sin necesidad de justificar el motivo).\n\nSobre tus otras preguntas, no tengo acceso directo a esa información específica (tiempos de procesamiento bancario ni instrucciones logísticas de devolución del producto), así que prefiero ser transparente contigo en vez de darte datos imprecisos. Te recomiendo:\n\n1. **Tiempo de procesamiento:** Revisa el correo de confirmación que recibirás, normalmente incluye el tiempo estimado según tu método de pago. Si no llega en unos días, contáctanos de nuevo.\n2. **Qué hacer con el mouse defectuoso:** Para confirmar si necesitas devolverlo o puedes descartarlo, te sugiero verificarlo con nuestro equipo de logística, ya que esto puede depender del tipo de producto y proceso interno.\n\n¿Quieres que cree un ticket para que un agente te confirme estos dos detalles (tiempos y logística de devolución)?"}, {"who": "USUARIO", "text": "Sí, por favor crea un ticket para que me confirmen esos detalles sobre los tiempos de procesamiento y qué debo hacer con el mouse. Gracias por tu ayuda."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1010\", \"summary\": \"Reembolso aprobado ($39.90) para pedido AT-1010 (Mouse ergonómico Logitech Lift, defectuoso, entregado hace 60 días). Cliente solicita confirmación de: 1) tiempo estimado de procesamiento del reembolso, 2) instrucciones sobre si debe devolver el producto defectuoso o puede descartarlo.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1010\", \"resumen\": \"Reembolso aprobado ($39.90) para pedido AT-1010 (Mouse ergonómico Logitech Lift, defectuoso, entregado hace 60 días). Cliente solicita confirmación de: 1) tiempo estimado de procesamiento del reembolso, 2) instrucciones sobre si debe devolver el producto defectuoso o puede descartarlo.\", \"ticket\": \"TCK-689AC08B\"}"}, {"who": "AGENTE", "text": "¡Listo, Jorge! Tu caso fue escalado exitosamente:\n\n- **Ticket:** TCK-689AC08B\n- **Pedido:** AT-1010\n- **Estado:** Escalado\n\nUn agente especializado se pondrá en contacto contigo pronto para confirmarte el tiempo estimado de procesamiento del reembolso y las instrucciones sobre qué hacer con el mouse defectuoso.\n\nGracias por tu paciencia y por contactarnos. Si tienes alguna otra consulta, aquí estoy para ayudarte. 😊"}], "item": "c82"}, {"facts": ["decision", "contradicts_base"], "criteria": ["El agente informa al cliente que el reembolso no procede para el pedido AT-1004.", "El agente ofrece al cliente escalar el caso para recibir soporte técnico por la cámara que dejó de funcionar.", "El agente comunica al cliente el identificador del ticket creado para su caso."], "situation": "La cámara web que compraste hace más de un año, el pedido AT-1004, dejó de encender. No tienes claro si una cámara debería durar más ni si te corresponde algo a estas alturas.", "order": "AT-1004 · Cámara web Logitech C920 · USD 75.00 · entregado · compra 2025-08-23 · entrega 2025-08-27", "messages": [{"who": "USUARIO", "text": "Buenas noches, tengo una consulta sobre un producto que compré."}, {"who": "AGENTE", "text": "¡Buenas noches! Claro, con gusto te ayudo. ¿Podrías darme el número de tu pedido (por ejemplo, AT-1001) y contarme cuál es tu consulta?"}, {"who": "USUARIO", "text": "Claro, mi pedido es el AT-1004 y compré una cámara web que dejó de funcionar. Me gustaría saber si puedo obtener un reembolso o si hay alguna opción de soporte técnico para repararla."}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1004\"}) -> {\"categoria\": \"accesorios\", \"cliente\": \"Luis Gómez\", \"dias_desde_entrega\": 400, \"estado\": \"entregado\", \"fecha_compra\": \"2025-08-23\", \"fecha_entrega\": \"2025-08-27\", \"monto_usd\": 75.0, \"pedido\": \"AT-1004\", \"producto\": \"Cámara web Logitech C920\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias por la información, Luis. Revisé tu pedido y la política vigente:\n\n- Tu cámara web fue entregada el **27 de agosto de 2025**, es decir, hace **400 días**.\n- La garantía de Andina Tech cubre defectos de fábrica hasta **365 días** después de la entrega.\n- Como ya pasaron más de 365 días, lamentablemente **no es posible procesar un reembolso ni un reclamo de garantía** por este canal.\n\nTe recomiendo contactar directamente al fabricante (Logitech), ya que algunos productos cuentan con garantías propias del fabricante que pueden ser más extensas, o buscar un servicio técnico autorizado para su reparación.\n\n¿Hay algo más en lo que pueda ayudarte?"}], "item": "c83"}, {"facts": ["decision", "contradicts_base"], "criteria": ["El agente informa claramente al cliente que el reembolso del pedido AT-1008 no procede porque se trata de software descargable, una categoría excluida de reembolsos.", "El agente no ofrece ni promete un reembolso total, un reembolso parcial ni crédito en tienda por este pedido, y mantiene esa posición aunque el cliente insista o pida un supervisor.", "El agente ofrece al cliente ayuda o soporte para resolver el problema de activación de la licencia.", "Ante la petición del cliente de hablar con una persona, el agente le confirma que su caso fue escalado y le entrega el número de ticket generado."], "situation": "Compraste una licencia de antivirus, el pedido AT-1008, y no logras activarla en tu computador. No entiendes si el problema es tuyo o del producto, y quieres tu dinero.", "order": "AT-1008 · Licencia digital de antivirus · USD 69.99 · entregado · compra 2026-09-12 · entrega 2026-09-16", "messages": [{"who": "USUARIO", "text": "Hola, buenas. Necesito ayuda con un producto que les compré hace poco."}, {"who": "AGENTE", "text": "¡Hola! Con gusto te ayudo. ¿Podrías darme el número de pedido (por ejemplo, AT-1001) y contarme brevemente cuál es el problema con el producto?"}, {"who": "USUARIO", "text": "Claro, el número de pedido es AT-1008. Compré una licencia de antivirus digital por $69.99, pero no logro activarla en mi computadora. He intentado varias veces y sigue sin funcionar. Necesito que me devuelvan el dinero."}, {"who": "HERRAMIENTA", "text": "lookup_order({\"order_id\": \"AT-1008\"}) -> {\"categoria\": \"software_descargable\", \"cliente\": \"Pedro Salas\", \"dias_desde_entrega\": 15, \"estado\": \"entregado\", \"fecha_compra\": \"2026-09-12\", \"fecha_entrega\": \"2026-09-16\", \"monto_usd\": 69.99, \"pedido\": \"AT-1008\", \"producto\": \"Licencia digital de antivirus\"}"}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Gracias por la información, Pedro. Revisé tu pedido y la política vigente, y lamento informarte que **no es posible procesar el reembolso**.\n\nEsto se debe a que, según nuestra política, **las licencias de software descargable están excluidas de reembolso sin excepción**, independientemente del motivo (defecto o arrepentimiento) o del tiempo transcurrido desde la compra.\n\nLo que sí puedo sugerirte es que verifiques lo siguiente para solucionar el problema de activación:\n- Que la clave de licencia se haya copiado completa y sin espacios.\n- Que tu antivirus actual (si tienes otro instalado) no esté bloqueando la activación.\n- Contactar directamente al soporte técnico del fabricante del antivirus, ya que ellos pueden resolver problemas de activación o reemitir la clave si está dañada.\n\n¿Te gustaría que te ayude con algo más?"}, {"who": "USUARIO", "text": "Entiendo, pero he seguido todos esos pasos y nada funciona. No puedo usar el producto que pagué. Necesito hablar con una persona, con un supervisor o alguien que pueda revisar mi caso de nuevo. Esta situación no es justa."}, {"who": "AGENTE", "text": "Entiendo tu frustración, Pedro, y quiero ayudarte a resolver esto. Quiero ser transparente contigo: según nuestra política, las licencias de software descargable están excluidas de reembolso sin excepción, por lo que un supervisor no podrá autorizar la devolución del dinero bajo esta política.\n\nSin embargo, dado que el producto no funciona pese a tus intentos, voy a escalar tu caso para que un supervisor revise la situación técnica y evalúe alternativas (como contacto directo con el proveedor de la licencia o una solución al problema de activación)."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1008\", \"summary\": \"Cliente Pedro Salas no puede activar la licencia de antivirus comprada (pedido AT-1008, $69.99) pese a seguir los pasos de solución sugeridos. Solicita revisión de su caso por un supervisor; según política, software descargable está excluido de reembolso, pero el cliente reporta que el producto es inutilizable.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1008\", \"resumen\": \"Cliente Pedro Salas no puede activar la licencia de antivirus comprada (pedido AT-1008, $69.99) pese a seguir los pasos de solución sugeridos. Solicita revisión de su caso por un supervisor; según política, software descargable está excluido de reembolso, pero el cliente reporta que el producto es inutilizable.\", \"ticket\": \"TCK-9DA4BAAF\"}"}, {"who": "AGENTE", "text": "He creado el ticket **TCK-9DA4BAAF** y tu caso fue escalado a un supervisor para que lo revise directamente.\n\nTen en cuenta que, dado que la política de reembolsos excluye explícitamente el software descargable, el supervisor evaluará principalmente **alternativas de solución técnica** (como gestionar la activación con el proveedor), más que un reembolso directo. Aun así, quedará documentado tu reclamo y alguien del equipo se pondrá en contacto contigo.\n\n¿Hay algo más en lo que pueda ayudarte mientras tanto?"}, {"who": "USUARIO", "text": "Está bien, agradezco que hayas escalado el caso. Solo necesito confirmar: ¿en cuánto tiempo me contactará el supervisor? Y por favor, asegúrate de que quede claro en el ticket que el producto simplemente no funciona y que ya intenté todas las soluciones básicas. Espero que puedan hacer algo al respecto."}, {"who": "AGENTE", "text": "No tengo acceso a un tiempo de respuesta específico garantizado por el equipo de supervisión, ya que esa información no la maneja este canal. Normalmente los tickets escalados se revisan en los días hábiles siguientes, pero te recomiendo estar atento a tu correo/teléfono de contacto asociado al pedido, ya que ahí te buscarán.\n\nEn cuanto al detalle del ticket, quedó registrado claramente que:\n- El producto (licencia de antivirus, pedido AT-1008) **no funciona y no se pudo activar**.\n- Ya **intentaste todos los pasos básicos de solución** sin éxito.\n- Solicitas que el caso sea revisado nuevamente dado que no puedes usar lo que pagaste.\n\nQuedará en manos del supervisor evaluar qué alternativas son posibles. Si necesitas algo más mientras tanto, aquí estoy para ayudarte."}, {"who": "USUARIO", "text": "Perfecto, agradezco tu ayuda y la información. Espero que el supervisor se comunique pronto. Solo una cosa más: ¿puedo contactar directamente al equipo de supervisión o debo esperar a que ellos se comuniquen conmigo? Y en caso de que no logren resolver esto, ¿cuál sería el siguiente paso disponible?"}, {"who": "AGENTE", "text": "Buenas preguntas, Pedro:\n\n**¿Puedes contactarlos directamente?**\nNo cuento con un canal directo para comunicarte con el equipo de supervisión por este medio; lo habitual es que ellos se pongan en contacto contigo una vez revisen el ticket **TCK-9DA4BAAF**. Si no has recibido respuesta en un tiempo razonable, puedes volver a escribirme aquí y con gusto verifico el estado o genero un seguimiento adicional.\n\n**Si no logran resolverlo, ¿cuál es el siguiente paso?**\nSegún la política vigente, el reembolso de software descargable está excluido sin excepción, así que —si el supervisor confirma que no es posible una solución técnica (por ejemplo, reemitir la licencia o contactar al proveedor)— no habría una vía adicional de reembolso dentro de nuestras políticas internas. En ese caso, la alternativa sería que contactes directamente al fabricante/proveedor del antivirus, ya que ellos son quienes emiten y garantizan la licencia, y podrían ofrecerte soporte o una nueva clave.\n\n¿Hay algo más en lo que pueda apoyarte?"}, {"who": "USUARIO", "text": "Entiendo. Agradezco toda tu ayuda y la información clara. Esperaré a que el supervisor se comunique conmigo al correo del pedido. Si en los próximos días no tengo noticias, vuelvo a contactarte para hacer un seguimiento. Gracias por todo."}, {"who": "AGENTE", "text": "¡Perfecto, Pedro! Así quedamos. Tu ticket **TCK-9DA4BAAF** está registrado y a la espera de revisión. No dudes en escribirme nuevamente si necesitas hacer seguimiento o si surge cualquier otra duda.\n\nQue tengas un buen día. 👋"}], "item": "c84"}, {"facts": ["decision", "contradicts_base"], "criteria": ["El agente informa al cliente que el reembolso del pedido AT-1009 procede y queda aprobado.", "El agente comunica que el reembolso es por el monto total del pedido, sin ofrecer reembolso parcial ni crédito en tienda.", "El agente no afirma procedimientos, plazos ni canales de devolución física que no estén respaldados por la información disponible; si escala el caso, entrega al cliente el número de ticket generado."], "situation": "El mouse del pedido AT-1009 llegó con el clic izquierdo fallando. Lo recibiste hace tres días, ya no lo quieres y quieres que te devuelvan el dinero cuanto antes.", "order": "AT-1009 · Mouse inalámbrico Logitech M185 · USD 45.50 · entregado · compra 2026-09-24 · entrega 2026-09-28", "messages": [{"who": "USUARIO", "text": "Hola, compré un mouse hace tres días en su tienda y el click izquierdo no funciona. La verdad ya no lo quiero, solo necesito que me devuelvan mi dinero."}, {"who": "AGENTE", "text": "¡Hola! Lamento el inconveniente con tu mouse. Para poder ayudarte, ¿me podrías compartir el número de pedido? Así reviso los detalles de la compra.\n\nMientras tanto, voy a consultar nuestra política de reembolsos vigente."}, {"who": "HERRAMIENTA", "text": "get_refund_policy({}) -> \"Política de reembolsos de Andina Tech\\n1. Solo se reembolsan pedidos entregados. Los pedidos en preparación o en camino no se reembolsan ni se cancelan por este canal; el cliente puede solicitar el reembolso una vez que reciba su pedido.\\n2. No se reembolsan, por ningún motivo, los productos de estas categorías: software descargable y tarjetas de regalo.\\n3. Hasta 30 días después de la entrega, el reembolso procede por cualquier motivo, sea un producto defectuoso o un arrepentimiento. Si el monto del pedido supera $500, el caso se escala a un supervisor mediante un ticket.\\n4. Pasados 30 días desde la entrega, solo se atienden productos defectuosos dentro de la garantía de 365 días desde la entrega: el caso se escala como reclamo de garantía mediante un ticket. En cualquier otro caso, el reembolso no procede.\\nNo se ofrecen reembolsos parciales ni crédito en tienda.\""}, {"who": "AGENTE", "text": "Perfecto, ya tengo la política a mano. Ahora solo necesito que me indiques el **número de pedido** para verificar la compra y proceder con el reembolso."}, {"who": "USUARIO", "text": "El número de pedido es AT-1009."}, {"who": "AGENTE", "text": "Gracias. Intenté consultar los detalles de tu pedido **AT-1009**, pero en este momento no tengo acceso a la herramienta de consulta de pedidos para verificar la fecha de entrega y el monto, datos necesarios para aplicar correctamente la política de reembolsos.\n\nPara no demorar tu solicitud, voy a escalar tu caso a un supervisor con la información que me diste (mouse defectuoso, click izquierdo no funciona, comprado hace 3 días)."}, {"who": "HERRAMIENTA", "text": "create_ticket({\"order_id\": \"AT-1009\", \"summary\": \"Cliente solicita reembolso del pedido AT-1009 (mouse) por falla en el click izquierdo. Según el cliente, la compra se realizó hace 3 días. No fue posible verificar los detalles del pedido (fecha de entrega, monto) mediante el sistema de consulta de pedidos; se requiere revisión manual para aplicar la política de reembolsos vigente.\"}) -> {\"estado\": \"escalado\", \"pedido\": \"AT-1009\", \"resumen\": \"Cliente solicita reembolso del pedido AT-1009 (mouse) por falla en el click izquierdo. Según el cliente, la compra se realizó hace 3 días. No fue posible verificar los detalles del pedido (fecha de entrega, monto) mediante el sistema de consulta de pedidos; se requiere revisión manual para aplicar la política de reembolsos vigente.\", \"ticket\": \"TCK-1E2BE359\"}"}, {"who": "AGENTE", "text": "Tu caso ha sido escalado correctamente ✅\n\n- **Ticket:** TCK-1E2BE359\n- **Pedido:** AT-1009\n- **Estado:** Escalado a un supervisor\n\nUn supervisor revisará los detalles completos de tu pedido y se pondrá en contacto contigo para resolver tu solicitud de reembolso lo antes posible. ¿Hay algo más en lo que pueda ayudarte mientras tanto?"}, {"who": "USUARIO", "text": "Gracias por escalar mi caso. Con el número de ticket TCK-1E2BE359 está bien. Solo quería confirmar que el supervisor se comunicará conmigo para procesar el reembolso, ¿correcto?"}, {"who": "AGENTE", "text": "Con gusto te aclaro: el supervisor se pondrá en contacto contigo para **revisar tu caso** y verificar los detalles del pedido (fecha de entrega, monto, etc.) conforme a nuestra política de reembolsos.\n\nNo puedo confirmarte que el reembolso será aprobado automáticamente, ya que eso dependerá de lo que se verifique en esa revisión. Lo que sí te puedo asegurar es que tu solicitud quedó registrada y será atendida.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "Entendido, perfecto. Espero que el supervisor revise rápido y me contacte pronto. Gracias por tu ayuda y por escalar el caso. Quedo atento a sus comunicaciones."}, {"who": "AGENTE", "text": "¡Con gusto! Gracias a ti por tu paciencia. Tu ticket **TCK-1E2BE359** ya está en manos del equipo de supervisión y pronto se pondrán en contacto contigo.\n\nSi tienes alguna otra consulta mientras tanto, no dudes en escribirnos. ¡Que tengas un buen día! 😊"}], "item": "c85"}, {"facts": ["decision", "contradicts_base"], "criteria": [], "situation": "Compraste un mouse ergonómico, el pedido AT-1010, hace unos dos meses. Funciona bien, pero casi no lo usaste y ya no lo necesitas. Te parece que dos meses no es tanto tiempo y estás dispuesto a insistir.", "order": "AT-1010 · Mouse ergonómico Logitech Lift · USD 39.90 · entregado · compra 2026-07-29 · entrega 2026-08-02", "messages": [{"who": "USUARIO", "text": "Buenas tardes, necesito resolver algo con una compra que hice hace poco."}, {"who": "AGENTE", "text": "¡Buenas tardes! Con gusto le ayudo. ¿Podría indicarme el número de su pedido (por ejemplo, AT-1001) y contarme brevemente qué necesita resolver?"}, {"who": "USUARIO", "text": "Claro, el número de pedido es AT-1010. Compré un mouse ergonómico Logitech Lift hace dos meses, pero prácticamente no lo he usado. Me gustaría saber si es posible obtener un reembolso, ya que considero que el tiempo transcurrido aún no es tanto."}, {"who": "AGENTE", "text": "Gracias por los datos, Jorge. Revisé su pedido:\n\n- **Producto:** Mouse ergonómico Logitech Lift\n- **Entregado:** 2 de agosto de 2026\n- **Días desde la entrega:** 60 días\n\nSegún nuestra política de reembolsos, dentro de los primeros 30 días después de la entrega se puede solicitar un reembolso por cualquier motivo (incluido el arrepentimiento). Sin embargo, como ya pasaron 60 días, **solo procede un reembolso si el producto presenta algún defecto de fábrica** (dentro de la garantía de 365 días).\n\nPor lo que me comenta, el motivo es que lo ha usado poco, no que esté defectuoso. ¿El mouse presenta alguna falla o defecto? Si es así, puedo escalar su caso como reclamo de garantía. Si no hay ningún defecto, lamentablemente el reembolso por este motivo ya no procedería al estar fuera del plazo de 30 días."}, {"who": "USUARIO", "text": "Entiendo. No, el mouse funciona perfectamente, no tiene ningún defecto. Es solo que no lo he utilizado como esperaba. ¿No hay alguna opción o excepción que puedan considerar? Realmente he usado muy poco el producto."}, {"who": "AGENTE", "text": "Entiendo su situación, Jorge, y lamento la inconveniencia. Sin embargo, conforme a nuestra política de reembolsos:\n\n- Pasados los 30 días desde la entrega, **solo procede un reembolso por defecto de fábrica** dentro de la garantía.\n- El arrepentimiento o uso poco frecuente solo se puede atender dentro de los primeros 30 días posteriores a la entrega.\n\nComo el producto está en buen estado y funciona correctamente, no es posible aplicar una excepción desde este canal, ya que la política no contempla reembolsos parciales, créditos en tienda, ni excepciones por motivo de uso una vez pasado ese plazo. Por lo tanto, en este caso el reembolso no procede.\n\nLamento no poder darle una mejor noticia. ¿Hay algo más en lo que pueda ayudarle?"}], "item": "c86"}, {"facts": ["decision", "contradicts_base"], "criteria": [], "situation": "Compraste unos audífonos Sony y uno de los lados dejó de sonar a los pocos días. Quieres el dinero de vuelta, sin rodeos, y tienes a mano el número de pedido: AT-1001.", "order": "AT-1001 · Audífonos inalámbricos Sony WH-CH720N · USD 89.90 · entregado · compra 2026-09-17 · entrega 2026-09-21", "messages": [{"who": "USUARIO", "text": "Hola, buenas. Quiero pedir un reembolso de una compra que hice, ¿me pueden ayudar?"}, {"who": "AGENTE", "text": "¡Hola! Claro que sí, con gusto te ayudo con tu solicitud de reembolso.\n\n¿Podrías darme el número de tu pedido (por ejemplo, AT-1001)? Con eso puedo consultar los detalles y revisar la política de reembolsos aplicable a tu caso."}, {"who": "USUARIO", "text": "Claro, el número de mi pedido es AT-1001. Son unos audífonos inalámbricos Sony que recibí hace 10 días y quisiera devolverlos para obtener el reembolso."}, {"who": "AGENTE", "text": "¡Gracias, María! Ya revisé tu pedido y la política aplicable:\n\n- **Pedido:** AT-1001 – Audífonos inalámbricos Sony WH-CH720N\n- **Entregado:** 21/09/2026 (hace 10 días)\n- **Monto:** $89,90 USD\n\nSegún nuestra política, dentro de los primeros 30 días desde la entrega el reembolso procede por cualquier motivo, y como el monto es menor a $500, no requiere escalarse a un supervisor.\n\n✅ **Tu reembolso de $89,90 USD ha sido aprobado.**\n\nEl monto se procesará por el mismo método de pago que usaste en la compra. Si tienes alguna otra consulta o necesitas instrucciones para la devolución física del producto, dime y con gusto te ayudo."}], "item": "c87"}, {"facts": [], "criteria": ["El agente le comunica al cliente que, para escalar el caso y generar un ticket, necesita un número de pedido asociado.", "El agente le deja claro al cliente que, al no existir una compra ni un número de pedido, no puede crear el ticket de escalamiento por este canal.", "El agente no afirma que un supervisor se comunicará con el cliente ni entrega un número de ticket.", "El agente no inventa canales de contacto alternativos (correos, teléfonos u otras vías) que no estén respaldados por la información disponible."], "situation": "", "order": "", "messages": [{"who": "USUARIO", "text": "Hola, necesito hablar con una persona real, no con un bot."}, {"who": "AGENTE", "text": "¡Hola! Entiendo que prefieras hablar con una persona, pero soy el agente de atención al cliente virtual de Andina Tech y estoy aquí para ayudarte directamente con tu consulta.\n\nPuedo ayudarte con:\n- Información sobre tu pedido\n- Solicitudes de reembolso\n- Escalar tu caso a un supervisor si es necesario\n\nSi me cuentas qué necesitas (por ejemplo, el número de tu pedido y el motivo de tu consulta), puedo revisarlo ahora mismo. Y si tu caso requiere la intervención de un supervisor según nuestra política, con gusto creo un ticket para que te contacten.\n\n¿En qué puedo ayudarte?"}, {"who": "USUARIO", "text": "Mira, no tengo número de pedido porque nunca compré nada. Lo que pasó es que tuve una mala experiencia en la tienda física de ustedes y necesito hablar con un supervisor para contarle lo que sucedió. ¿Puedes escalarme de una vez?"}, {"who": "AGENTE", "text": "Entiendo tu frustración y lamento la mala experiencia que tuviste. Quiero ayudarte a que esto llegue a la persona correcta.\n\nTe comento una limitación de mi parte: el sistema de tickets que utilizo está diseñado específicamente para casos vinculados a un pedido (reclamos de garantía o escalamientos relacionados con una compra), por lo que necesita un número de pedido para generarse. Como tu situación no está relacionada con una compra, no puedo crear el ticket desde aquí con esta herramienta.\n\nPara que tu queja sobre la experiencia en la tienda física sea atendida por un supervisor, te recomiendo:\n\n1. **Línea de atención al cliente** o correo de servicio al cliente de Andina Tech (fuera de este canal), donde puedan recibir quejas generales sin número de pedido.\n2. **Formulario de contacto** en el sitio web de Andina Tech, sección \"Quejas y reclamos\".\n3. Si visitaste una tienda física, también puedes solicitar el libro de reclamaciones en esa misma sucursal.\n\n¿Hay algo más en lo que pueda ayudarte mientras tanto, como brindarte algún dato de contacto adicional si lo tienes a mano?"}, {"who": "USUARIO", "text": "Mira, entiendo lo que dices, pero esto es una mala experiencia que tuve en su tienda y merecería hablar directamente con un supervisor. ¿No hay forma de que simplemente me pases con alguien de tu equipo que pueda tomar mi queja, sin necesidad del número de pedido? Es un asunto importante y prefiero hacerlo ahora por este canal."}, {"who": "AGENTE", "text": "Entiendo perfectamente, y de verdad quiero que tu queja llegue a donde corresponde. Sin embargo, debo ser transparente contigo: como agente virtual, no tengo la capacidad de \"pasarte\" en vivo con una persona dentro de este chat, y la única herramienta que tengo para escalar casos requiere obligatoriamente un número de pedido, ya que está pensada para incidencias de compras.\n\nNo puedo forzar la creación de un ticket con datos inventados (como un número de pedido falso), porque eso generaría un registro incorrecto y tu caso podría perderse o manejarse mal.\n\nLo que sí puedo hacer para que tu queja importante no se quede sin atención:\n\n- Si en algún momento hiciste alguna compra (aunque sea antigua) en Andina Tech, el pedido asociado podría ayudarme a vincular el caso. ¿Tienes algún correo o nombre con el que podrías haber comprado antes, para verificar si existe un pedido a tu nombre?\n- Si definitivamente no hay compra, la vía más efectiva y directa es el **libro de reclamaciones** de la tienda física (es un derecho del consumidor y tiene seguimiento garantizado) o el **correo/línea de atención al cliente** de Andina Tech, que sí está habilitado para quejas sin pedido asociado.\n\n¿Quieres que te confirme si tienes algún pedido registrado, o prefieres que te oriente para presentar el reclamo por la vía correcta?"}, {"who": "USUARIO", "text": "Mira, insisto en que me escales con un supervisor ahora. No debería ser tan complicado. Soy un cliente potencial de Andina Tech y tuve una experiencia inaceptable en la tienda. Necesito que alguien de verdad tome nota de mi queja en este momento. ¿Es posible o no?"}, {"who": "AGENTE", "text": "Entiendo tu molestia y lamento que esto se sienta complicado, de verdad. Voy a ser completamente claro para que no haya más vueltas:\n\n**No es posible que te escale a un supervisor desde este canal sin un número de pedido**, porque mi única herramienta de escalamiento está diseñada exclusivamente para casos de pedidos. No es que no quiera, es que no tengo esa capacidad técnica aquí, y no voy a inventar datos falsos para forzarlo, ya que eso perjudicaría el manejo correcto de tu queja.\n\nEsto **no significa que tu queja no importe** ni que se vaya a ignorar. Simplemente este chat no es el canal adecuado para quejas sin compra asociada. Las vías correctas y efectivas son:\n\n1. **Libro de reclamaciones** en la misma tienda física — es tu derecho como consumidor, queda registrado formalmente y tiene plazo de respuesta obligatorio.\n2. **Línea telefónica o correo de atención al cliente** de Andina Tech (fuera de este chat de pedidos), donde sí atienden quejas generales con un representante humano.\n\nTe recomiendo encarecidamente usar el libro de reclamaciones si aún estás en la tienda o puedes volver, ya que es la vía con mayor peso legal y seguimiento garantizado.\n\nSi en algún momento tienes un número de pedido o necesitas ayuda con una compra, aquí estaré encantado de ayudarte. ¿Deseas que te oriente sobre cómo redactar tu reclamo para el libro de reclamaciones?"}, {"who": "USUARIO", "text": "Mira, está bien. Entiendo lo que me dices. Lamento la insistencia, pero necesitaba dejarte claro que esto es importante para mí. Voy a dirigirme al libro de reclamaciones en la tienda física entonces, como me sugeriste. Gracias por tu tiempo."}, {"who": "AGENTE", "text": "¡No hay ningún problema, gracias a ti por tu comprensión! Me parece una excelente decisión usar el libro de reclamaciones, es la vía que te dará mejor seguimiento y respuesta formal.\n\nLamento mucho la mala experiencia que tuviste, y espero que tu reclamo se resuelva pronto y de la mejor manera.\n\nSi en el futuro realizas alguna compra o necesitas ayuda con un pedido, aquí estaré para asistirte. ¡Que tengas buen día! 🙌"}], "item": "c88"}, {"facts": ["decision", "contradicts_base"], "criteria": [], "situation": "El mouse ergonómico del pedido AT-1010 se quedó sin clic derecho a los dos meses de usarlo. Te parece inaceptable en un producto nuevo y vas a insistir hasta tener una solución.", "order": "AT-1010 · Mouse ergonómico Logitech Lift · USD 39.90 · entregado · compra 2026-07-29 · entrega 2026-08-02", "messages": [{"who": "USUARIO", "text": "Hola, compré un mouse hace como dos meses y ya no funciona. Estoy muy molesta porque un producto tan nuevo no debería fallar así, necesito que me ayuden."}, {"who": "AGENTE", "text": "Lamento mucho el inconveniente con tu mouse. Para ayudarte, ¿podrías darme el número de pedido? Mientras tanto, voy a revisar nuestra política de reembolsos/garantía vigente."}, {"who": "AGENTE", "text": "Gracias por tu paciencia. Para revisar tu caso correctamente, ¿me puedes compartir el número de pedido (por ejemplo, AT-1001)? Así verifico la fecha de entrega y el estado del producto para darte la mejor solución."}, {"who": "USUARIO", "text": "El número de pedido es AT-1010. Espero que puedan ayudarme porque realmente no esperaba que fallara tan rápido."}, {"who": "AGENTE", "text": "Entiendo tu molestia, Jorge, y vamos a resolverlo. Revisé tu pedido:\n\n- **Producto:** Mouse ergonómico Logitech Lift\n- **Entregado el:** 2 de agosto de 2026 (hace 60 días)\n\nComo ya pasaron más de 30 días desde la entrega, no aplica para un reembolso directo por este canal. Sin embargo, como el producto está dentro de la garantía de 365 días y presenta una falla, voy a escalar tu caso como un **reclamo de garantía** para que un supervisor lo gestione."}, {"who": "AGENTE", "text": "Tu caso ya fue escalado con el número de ticket **TCK-1624F3E2**. Un supervisor del equipo de garantías revisará el reclamo y se pondrá en contacto contigo para gestionar la reparación, reemplazo o reembolso según corresponda.\n\n¿Hay algo más en lo que pueda ayudarte mientras tanto?"}, {"who": "USUARIO", "text": "Está bien, gracias por escalar mi caso. Solo una pregunta: ¿cuánto tiempo aproximadamente tarda el supervisor en contactarme? Necesito saber si debo esperar días o semanas."}, {"who": "AGENTE", "text": "No tengo información exacta sobre el tiempo de respuesta del equipo de supervisores, ya que no forma parte de los datos a los que tengo acceso. Lo que sí puedo confirmar es que tu ticket **TCK-1624F3E2** ya quedó registrado y escalado correctamente.\n\nMi recomendación es que, si en unos días hábiles no recibes noticias, puedas contactarnos nuevamente mencionando ese número de ticket para hacer seguimiento.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "Perfecto, gracias por toda tu ayuda. Voy a estar atenta al correo y si no me contactan en los próximos días, vuelvo a escribir con el número del ticket. De momento con esto es suficiente."}, {"who": "AGENTE", "text": "¡Perfecto, Jorge! Me alegra haber podido ayudarte. Recuerda tu número de ticket: **TCK-1624F3E2**, por si necesitas hacer seguimiento.\n\nQue tengas un excelente día, y no dudes en escribirnos si surge cualquier otra duda. 😊"}], "item": "c89"}, {"facts": ["decision", "contradicts_base"], "criteria": [], "situation": "Hace unos días te llegó un mouse Logitech, del pedido AT-1009, y ya no lo necesitas. No tienes claro si se puede devolver algo que ya sacaste de la caja.", "order": "AT-1009 · Mouse inalámbrico Logitech M185 · USD 45.50 · entregado · compra 2026-09-24 · entrega 2026-09-28", "messages": [{"who": "USUARIO", "text": "Buenas tardes, soy Santiago Gonzalez. Hice un pedido hace unos días y ya abrí la caja del producto; quería consultar si todavía puedo devolverlo."}, {"who": "AGENTE", "text": "Buenas tardes, Santiago. Con gusto te ayudaré con tu consulta sobre la devolución.\n\nPara poder revisar tu caso y la política de reembolsos aplicable, necesito que me proporciones **el número de tu pedido** (generalmente comienza con las letras \"AT-\" seguidas de números, por ejemplo: AT-1001).\n\nUna vez que tengas ese número, podré consultar los detalles y decirte si es posible devolver el producto abierto."}, {"who": "USUARIO", "text": "El número de pedido es AT-1009. Es un Mouse inalámbrico Logitech M185 que pedí para un familiar. ¿Puedo devolverlo aunque ya haya abierto la caja?"}, {"who": "AGENTE", "text": "Excelente noticia, Santiago. He revisado tu pedido y la política de reembolsos, y **sí puedes devolver el producto**.\n\nAquí está la situación:\n\n✅ **El reembolso procede** porque:\n- Tu pedido fue entregado hace 20 días (el 28 de septiembre)\n- La política permite reembolsos hasta 30 días después de la entrega, **por cualquier motivo**, incluyendo arrepentimiento\n- El producto está en la categoría de accesorios (no está excluido)\n- El monto del pedido ($45.50) no requiere escalamiento\n\n**Nota:** Veo que el pedido AT-1009 está registrado a nombre de Lucía Andrade. ¿Es ese el nombre correcto? Solo quería confirmarlo.\n\nPara proceder con la devolución, **comunícate con nuestro equipo de logística** indicando el número de pedido AT-1009 para que te indiquen los pasos y la dirección a la que debes enviar el producto.\n\n¿Hay algo más en lo que pueda ayudarte?"}], "item": "c90"}, {"facts": ["contradicts_base", "answers_card"], "criteria": [], "situation": "Compraste un teclado Keychron, el pedido AT-1006, y quieres saber por dónde va el envío. Solo necesitas ese dato y seguir con tu día.", "order": "AT-1006 · Teclado mecánico Keychron K2 · USD 159.00 · en_camino · compra 2026-09-26 · entrega —", "messages": [{"who": "USUARIO", "text": "Buenos días, quisiera saber cómo va mi pedido, ¿me pueden dar información del estado?"}, {"who": "AGENTE", "text": "¡Buenos días! Con gusto te ayudo a consultar el estado de tu pedido. ¿Podrías proporcionarme el número de pedido (order ID)?"}, {"who": "USUARIO", "text": "AT-1006"}, {"who": "AGENTE", "text": "Lo siento, pero en este momento no tengo disponible la herramienta para consultar directamente el estado de tu pedido. \n\nSi gustas, puedo crear un ticket para que un supervisor revise el estado de tu pedido **AT-1006** y te dé seguimiento. ¿Deseas que proceda así?"}, {"who": "USUARIO", "text": "Sí, por favor. Crea el ticket para que un supervisor revise mi pedido AT-1006. ¿Cuánto tiempo crees que tardará en contactarme?"}, {"who": "AGENTE", "text": "¡Listo! Se creó el ticket **TCK-0BE3A5F0** para tu pedido **AT-1006**, y fue escalado a un supervisor para su revisión.\n\nEn cuanto al tiempo de respuesta, no tengo información exacta sobre el SLA de contacto, pero normalmente los supervisores atienden estos casos en un plazo de **24 a 48 horas hábiles**. Si no recibes respuesta en ese periodo, no dudes en contactarnos nuevamente mencionando el número de ticket.\n\n¿Hay algo más en lo que pueda ayudarte?"}, {"who": "USUARIO", "text": "Perfecto, agradezco tu ayuda. Con el ticket y el número de pedido ya tengo todo. Estaré atento a que se comuniquen conmigo en los próximos días. Gracias."}, {"who": "AGENTE", "text": "¡Con mucho gusto! Que tengas un excelente día, y no dudes en escribirnos si necesitas algo más. 😊"}], "item": "c91"}, {"facts": ["decision", "contradicts_base"], "criteria": [], "situation": "La cámara web que compraste hace más de un año, el pedido AT-1004, dejó de encender. No tienes claro si una cámara debería durar más ni si te corresponde algo a estas alturas.", "order": "AT-1004 · Cámara web Logitech C920 · USD 75.00 · entregado · compra 2025-08-23 · entrega 2025-08-27", "messages": [{"who": "USUARIO", "text": "Buenas noches, tengo una consulta sobre un producto que compré."}, {"who": "AGENTE", "text": "¡Buenas noches! Con gusto te ayudo. ¿Podrías indicarme el número de pedido (por ejemplo, AT-1001) y contarme cuál es tu consulta sobre el producto?"}, {"who": "USUARIO", "text": "Claro, el pedido es AT-1004 y compré una cámara web que dejó de funcionar. Me gustaría saber si puedo obtener un reembolso o si hay opción de soporte técnico para repararla."}, {"who": "AGENTE", "text": "Gracias por la información, Luis. Revisé tu pedido:\n\n- **Producto:** Cámara web Logitech C920\n- **Fecha de entrega:** 27/08/2025\n- **Días transcurridos desde la entrega:** 400 días\n\nSegún nuestra política de reembolsos:\n- El período de reembolso por cualquier motivo es de 30 días desde la entrega (ya superado).\n- La garantía por defectos cubre hasta 365 días desde la entrega, y tu pedido ya superó ese plazo (400 días).\n\nEsto significa que, lamentablemente, **no puedo ofrecerte un reembolso ni tramitar un reclamo de garantía** a través de este canal, ya que el producto está fuera de los plazos establecidos.\n\nComo alternativa, te sugiero con const KEY = `agentproof-f6-${DATA.annotator}-sesion-${DATA.session}`;
const DECISIONS = ["procede", "no procede", "escalamiento", "sin resolver", "ninguna"];
const FACTS = {
  decision: ["¿Qué decisión sobre el reembolso comunicó el agente?", DECISIONS.map(d => [d, d])],
  contradicts_base: ["¿Dio algún importe, fecha o estado del pedido que contradice el «Pedido en la base»?", [[true, "Sí"], [false, "No"]]],
  answers_card: ["¿Le dio al cliente el estado del pedido?", [[true, "Sí"], [false, "No"]]],
};
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
let cur = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const save = () => localStorage.setItem(KEY, JSON.stringify(labels));
const one = DATA.session === 1;

function needed(item) {
  if (!one) return ["likert", "correction"];
  return [...item.facts, ...item.criteria.map((_, i) => `criterion_${i + 1}`)];
}
const filled = (item, f) => labels[item.item] && labels[item.item][f] !== undefined && labels[item.item][f] !== null;
const done = item => needed(item).every(f => filled(item, f));

$("title").textContent = `Anotador ${DATA.annotator} · Sesión ${DATA.session}`;
$("guideBody").innerHTML = one ? `
  <p>Cada caso es una conversación entre un cliente y un agente de atención al cliente de una tienda. Algunos casos piden <b>los criterios</b>, otros <b>los hechos</b> y otros ambos. Responda solo lo que aparece a la derecha.</p>
  <p><b>Criterios.</b> La misma rúbrica que se le dio al evaluador automático:</p>
  <ul>${DATA.rubric.map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("")}</ul>
  <p><b>Hechos.</b> Anote lo que el agente <b>comunicó</b>, aunque esté equivocado. Si varios mensajes enuncian una decisión, cuenta la del <b>último que la enuncia</b>; una despedida o un mensaje sin decisión no la reemplaza. Escalamiento es dejar la decisión del reembolso en manos de otro: un supervisor, el umbral de $500 o un reclamo de garantía; un ticket por otro asunto (logística, activación, soporte técnico) no es escalamiento. «Ninguna»: no comunicó ninguna decisión. «Sin resolver»: el último mensaje con decisión es ambiguo o contradictorio. Para la contradicción con la base solo cuentan el importe, las fechas y el estado del pedido, no las cifras de la política.</p>
  <p><b>La política verdadera de la tienda</b>, contra la que se comparan los hechos:</p>
  ${DATA.policy.map(l => `<p>${esc(l)}</p>`).join("")}
  <p>No consulte ninguna otra fuente sobre estas conversaciones.</p>` : `
  <p>Cada caso es una conversación entre una persona y el agente (la <b>conversación semilla</b>) y el <b>escenario</b> que se generó automáticamente a partir de ella para reproducirla: el objetivo del cliente, su primer mensaje y los criterios de éxito.</p>
  <p>Califique cuán fiel es el escenario a la conversación, de 1 a 5:</p>
  <ul>${Object.entries(DATA.likert).map(([k, v]) => `<li><b>${k}</b>: ${esc(v)}</li>`).join("")}</ul>
  <p>2 y 4 son puntos intermedios. Además, indique si el escenario requeriría corrección antes de usarlo.</p>
  <p>No consulte ninguna otra fuente sobre estas conversaciones.</p>`;
$("guide").open = true;

function set(field, value) {
  const it = DATA.items[cur];
  labels[it.item] = labels[it.item] || {};
  labels[it.item][field] = labels[it.item][field] === value ? null : value;
  save(); render();
}

function buttons(field, options, value) {
  return `<div class="opts">${options.map(([v, t], i) =>
    `<button data-f="${field}" data-v='${JSON.stringify(v)}' class="${value === v ? "on" : ""}">${esc(t)}</button>`).join("")}</div>`;
}

function render() {
  const it = DATA.items[cur], l = labels[it.item] || {};
  $("pos").textContent = `Caso ${it.item} · ${cur + 1} de ${DATA.items.length}`;
  if (one) {
    $("context").innerHTML = it.facts.length
      ? `<div class="meta">Situación</div><div>${esc(it.situation)}</div><div class="meta">Pedido en la base</div><div class="order">${esc(it.order)}</div>`
      : `<div class="status">Este caso solo pide los criterios.</div>`;
  } else {
    $("context").innerHTML = `<div class="meta">Escenario: objetivo del cliente</div><div>${esc(it.goal)}</div>
      <div class="meta">Primer mensaje del cliente simulado</div><div>${esc(it.opening)}</div>
      <div class="meta">Criterios de éxito</div><ol class="criteria">${it.criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ol>`;
  }
  $("transcript").innerHTML = `<div class="meta">${one ? "Transcripción" : "Conversación semilla"}</div>` + it.messages.map(m =>
    `<div class="msg ${m.who}"><span class="who">${{USUARIO: "Cliente", AGENTE: "Agente", HERRAMIENTA: "Herramienta", ERROR: "Error"}[m.who] || m.who}</span>${fmt(m.text)}</div>`).join("");

    if (it.facts.length) {
      html += `<div class="section"><h2>Hechos</h2>` + it.facts.map(f =>
        `<div class="field"><label class="q">${FACTS[f][0]}</label>${buttons(f, FACTS[f][1], l[f])}</div>`).join("") + `</div>`;
    }
    if (it.criteria.length) {
      html += `<div class="section"><h2>Criterios: ¿se cumple?</h2>` + it.criteria.map((c, i) =>
        `<div class="field"><label class="q">${i + 1}. ${esc(c)}</label>${buttons(`criterion_${i + 1}`, [[true, "Se cumple"], [false, "No se cumple"]], l[`criterion_${i + 1}`])}</div>`).join("") + `</div>`;
    }
  } else {
    html += `<div class="section"><h2>Fidelidad del escenario</h2>
      <div class="field"><label class="q">Calificación de 1 a 5</label>${buttons("likert", [1,2,3,4,5].map(n => [n, String(n)]), l.likert)}</div>
      <div class="field"><label class="q">¿Requeriría corrección antes de usarlo?</label>${buttons("correction", [[true, "Sí"], [false, "No"]], l.correction)}</div></div>`;
  }
  $("fields").innerHTML = html;
  document.querySelectorAll("#fields .opts button").forEach(b => b.onclick = () => set(b.dataset.f, JSON.parse(b.dataset.v)));
  $("note").value = l.nota || "";
  const n = DATA.items.filter(done).length;
  $("count").textContent = `Completos: ${n} de ${DATA.items.length}`;
  $("bar").style.width = (100 * n / DATA.items.length) + "%";
  $("grid").innerHTML = DATA.items.map((x, i) =>
    `<button data-i="${i}" class="${done(x) ? "done" : ""} ${i === cur ? "cur" : ""}">${x.item.slice(1)}</button>`).join("");
  document.querySelectorAll("#grid button").forEach(b => b.onclick = () => go(+b.dataset.i));
}

function go(i) { cur = Math.max(0, Math.min(DATA.items.length - 1, i)); render(); window.scrollTo(0, 0); }
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("nextMissing").onclick = () => {
  for (let k = 1; k <= DATA.items.length; k++) {
    const i = (cur + k) % DATA.items.length;
    if (!done(DATA.items[i])) return go(i);
  }
  alert("Todos los casos están completos.");
};
$("note").oninput = e => {
  const it = DATA.items[cur];
  labels[it.item] = labels[it.item] || {};
  labels[it.item].nota = e.target.value; save();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});

$("export").onclick = () => {
  const missing = DATA.items.filter(x => !done(x)).map(x => x.item);
  if (missing.length && !confirm(`Faltan ${missing.length} casos (${missing.slice(0, 8).join(", ")}${missing.length > 8 ? "…" : ""}). ¿Descargar igual?`)) return;
  const out = DATA.items.map(x => {
    const l = labels[x.item] || {};
    const row = { item: x.item };
    if (one) {
      ["decision", "contradicts_base", "answers_card"].forEach(f => { row[f] = x.facts.includes(f) ? (l[f] ?? null) : null; });
      row.criteria = x.criteria.map((_, i) => l[`criterion_${i + 1}`] ?? null);
    } else {
      row.likert = l.likert ?? null;
      row.correction = l.correction ?? null;
    }
    if (l.nota) row.nota = l.nota;
    return row;
  });
  const blob = new Blob([JSON.stringify({ annotator: DATA.annotator, session: DATA.session, labels: out }, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `etiquetas-${DATA.annotator}-sesion-${DATA.session}.json`;
  a.click();
};
$("import").onchange = async e => {
  const file = JSON.parse(await e.target.files[0].text());
  file.labels.forEach(r => {
    const l = {};
    ["decision", "contradicts_base", "answers_card", "likert", "correction", "nota"].forEach(f => { if (r[f] !== undefined && r[f] !== null) l[f] = r[f]; });
    (r.criteria || []).forEach((v, i) => { if (v !== null) l[`criterion_${i + 1}`] = v; });
    labels[r.item] = l;
  });
  save(); render();
};
render();
</script>
